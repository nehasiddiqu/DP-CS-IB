/* ---------- 17. linear vs binary search ---------- */
WIDGETS.search = el => {
  const SORTED = [3,8,12,17,21,26,30,34,41,45,52,58,63,70,77];
  const UNSORTED = [41,8,63,17,77,3,30,52,12,45,26,70,21,58,34];
  let mode = 'binary', data = SORTED, steps = [], k = 0;
  el.innerHTML = head('Linear search vs binary search', 'Choose a target and a method. Press <b>Next step</b> and count the comparisons.') + `
  <div class="row"><label class="lbl">target <input type="number" class="tg" value="58"></label>
  <div class="seg md" role="group" aria-label="Method"><button type="button" data-m="linear" aria-pressed="false">Linear</button><button type="button" data-m="binary" aria-pressed="true">Binary</button></div>
  <label class="lbl"><input type="checkbox" class="us"> unsorted data</label></div>
  <div class="scroll-x"><div class="cells c"></div></div>
  <div class="row"><button class="btn nx" type="button">Next step</button><button class="btn ghost al" type="button">Run to the end</button><button class="btn ghost rs" type="button">Reset</button><span class="counters"><span>comparisons: <b class="cmp">0</b></span></span></div>
  <div class="msg m"></div>`;
  const build = () => {
    const t = Math.trunc(+$(el,'.tg').value); steps = []; let c = 0;
    if (mode === 'linear'){
      for (let i=0;i<data.length;i++){ c++; const hit = data[i]===t; steps.push({cur:i, off:[...Array(i).keys()], c, found:hit?i:-1, msg:`Check index ${i}: is ${data[i]} == ${t}? ${hit?'<b>Yes! Found at index '+i+'.</b> Return '+i+'.':'No, move to the next item.'}`}); if (hit) return; }
      steps.push({cur:-1, off:[...Array(data.length).keys()], c, found:-1, end:true, msg:`Reached the end after ${c} comparisons. ${t} is not in the list. Return −1.`});
    } else {
      let lo = 0, hi = data.length-1;
      while (lo <= hi){
        const mid = Math.floor((lo+hi)/2); c++;
        const off = [...Array(data.length).keys()].filter(i => i<lo || i>hi);
        if (data[mid] === t){ steps.push({cur:mid, lo, hi, mid, off, c, found:mid, msg:`low=${lo}, high=${hi}, mid=(${lo}+${hi})//2=${mid}. ${data[mid]} == ${t}. <b>Found at index ${mid}.</b>`}); return; }
        const right = data[mid] < t;
        steps.push({cur:mid, lo, hi, mid, off, c, found:-1, msg:`low=${lo}, high=${hi}, mid=${mid}. ${data[mid]} ${right?'&lt;':'&gt;'} ${t}, so the target must be in the <b>${right?'right':'left'}</b> half. ${right?`low = mid + 1 = ${mid+1}`:`high = mid − 1 = ${mid-1}`}.`});
        if (right) lo = mid+1; else hi = mid-1;
      }
      steps.push({cur:-1, off:[...Array(data.length).keys()], c, found:-1, end:true, msg:`low (${lo}) is now bigger than high (${hi}). Nothing left to search: return −1.${data===UNSORTED?' <b>Binary search failed because the data is not sorted!</b>':''}`});
    }
  };
  const draw = () => {
    const s = steps[k-1];
    $(el,'.c').innerHTML = data.map((v,i)=>{ let cls=''; if (s){ if (s.found===i) cls='found'; else if (s.cur===i) cls='cur'; else if (s.off.includes(i)) cls='off'; }
      const ptr = s && mode==='binary' && !s.end ? [i===s.lo?'low':'', i===s.mid?'mid':'', i===s.hi?'high':''].filter(Boolean).join('/') : '';
      return `<div class="cell"><span class="ptr">${ptr}</span><div class="box ${cls}">${v}</div><span class="idx">[${i}]</span></div>`; }).join('');
    $(el,'.cmp').textContent = s ? s.c : 0;
    const m = $(el,'.m'); m.className = 'm msg' + (s && s.found>-1 ? ' good' : s && s.end ? ' bad' : '');
    m.innerHTML = s ? s.msg : (mode==='binary' ? 'Binary search looks at the <b>middle</b> and throws away half the list each time. It only works on <b>sorted</b> data.' : 'Linear search checks every item from the start, one by one. It works on any list.');
    $(el,'.nx').disabled = k >= steps.length;
  };
  const reset = () => { data = $(el,'.us').checked ? UNSORTED : SORTED; build(); k = 0; draw(); };
  $(el,'.nx').addEventListener('click', () => { if (k < steps.length) k++; draw(); });
  $(el,'.al').addEventListener('click', () => { k = steps.length; draw(); });
  $(el,'.rs').addEventListener('click', reset);
  $(el,'.tg').addEventListener('change', reset); $(el,'.us').addEventListener('change', reset);
  $$(el,'.md button').forEach(b => b.addEventListener('click', () => { mode = b.dataset.m; $$(el,'.md button').forEach(x => x.setAttribute('aria-pressed', x===b)); reset(); }));
  reset();
};

/* ---------- 18. bubble & selection sort ---------- */
WIDGETS.sort = (el, start) => {
  const T = timers(el);
  let algo = start || 'bubble', base = [5,1,4,2,8], steps = [], k = 0, playing = false;
  el.innerHTML = head('Watch the sort, one comparison at a time', 'Yellow = being compared · red = swapped · orange = smallest found so far · green = in its final place.') + `
  <div class="row"><div class="seg md" role="group" aria-label="Algorithm"><button type="button" data-m="bubble">Bubble sort</button><button type="button" data-m="selection">Selection sort</button></div>
  <button class="btn ghost rnd" type="button">New random list</button><button class="btn ghost pre" type="button">[5, 1, 4, 2, 8]</button><button class="btn ghost srt" type="button">Already sorted</button></div>
  <div class="bars b"></div>
  <div class="row"><button class="btn nx" type="button">Next step</button><button class="btn ghost pl" type="button">Play</button><button class="btn ghost rs" type="button">Reset</button>
  <span class="counters"><span>pass: <b class="ps">0</b></span><span>comparisons: <b class="cp">0</b></span><span>swaps: <b class="sw">0</b></span></span></div>
  <div class="msg m"></div>`;
  const build = () => {
    const a = [...base], n = a.length; steps = []; let cmp = 0, sw = 0;
    const push = (o) => steps.push({ arr:[...a], cmp, sw, ...o });
    if (algo === 'bubble'){
      for (let i=0;i<n-1;i++){
        let swapped = false;
        for (let j=0;j<n-i-1;j++){
          cmp++; const big = a[j] > a[j+1];
          push({ hl:[j,j+1], cls:'cmp', done:n-i, pass:i+1, msg:`Pass ${i+1}: compare ${a[j]} and ${a[j+1]}. ${big?`${a[j]} > ${a[j+1]}, so swap them.`:'Already in order, no swap.'}` });
          if (big){ [a[j],a[j+1]] = [a[j+1],a[j]]; sw++; swapped = true; push({ hl:[j,j+1], cls:'swap', done:n-i, pass:i+1, msg:`Swapped. ${a[j+1]} bubbles one place to the right.` }); }
        }
        push({ hl:[], done:n-i-1, pass:i+1, msg:`End of pass ${i+1}. The biggest unsorted value, ${a[n-i-1]}, is now in its final place.${!swapped?' <b>No swaps happened in this pass, so the list is sorted and we can stop early.</b>':''}` });
        if (!swapped) break;
      }
      push({ hl:[], done:0, pass:'✓', msg:`Sorted! ${cmp} comparisons and ${sw} swaps.`, fin:true });
    } else {
      for (let i=0;i<n-1;i++){
        let mi = i;
        push({ hl:[], min:mi, sortedTo:i, pass:i+1, msg:`Pass ${i+1}: assume the smallest unsorted value is ${a[i]} at index ${i}.` });
        for (let j=i+1;j<n;j++){
          cmp++; const smaller = a[j] < a[mi];
          push({ hl:[j], cls:'cmp', min:mi, sortedTo:i, pass:i+1, msg:`Compare ${a[j]} with the smallest so far (${a[mi]}). ${smaller?`${a[j]} is smaller, so it becomes the new minimum.`:'Not smaller.'}` });
          if (smaller) mi = j;
        }
        if (mi !== i){ [a[i],a[mi]] = [a[mi],a[i]]; sw++; push({ hl:[i,mi], cls:'swap', sortedTo:i+1, pass:i+1, msg:`Swap the minimum (${a[i]}) into index ${i}. One swap for this whole pass.` }); }
        else push({ hl:[], sortedTo:i+1, pass:i+1, msg:`${a[i]} is already the smallest, so no swap is needed.` });
      }
      push({ hl:[], sortedTo:n, pass:'✓', msg:`Sorted! ${cmp} comparisons and ${sw} swaps.`, fin:true });
    }
  };
  const draw = () => {
    const s = steps[k-1] || { arr:base, hl:[], cmp:0, sw:0, pass:0, msg:`Press <b>Next step</b>. ${algo==='bubble'?'Bubble sort compares neighbours and swaps them if they are in the wrong order.':'Selection sort finds the smallest value and puts it at the front, then repeats.'}` };
    const mx = Math.max(...s.arr), n = s.arr.length;
    $(el,'.b').innerHTML = s.arr.map((v,i) => { let c = '';
      if (s.fin) c = 'done'; else if (algo==='bubble' && s.done!=null && i >= s.done) c = 'done'; else if (algo==='selection' && s.sortedTo!=null && i < s.sortedTo) c = 'done';
      if (s.min === i) c = 'min'; if (s.hl.includes(i)) c = s.cls;
      return `<div class="bar ${c}" style="height:${Math.max(14, v/mx*180)}px">${v}</div>`; }).join('');
    $(el,'.ps').textContent = s.pass; $(el,'.cp').textContent = s.cmp; $(el,'.sw').textContent = s.sw; $(el,'.m').innerHTML = s.msg;
    $(el,'.m').className = 'm msg' + (s.fin ? ' good' : '');
    $(el,'.nx').disabled = k >= steps.length;
  };
  const stop = () => { playing = false; T.clear(); $(el,'.pl').textContent = 'Play'; };
  const reset = () => { stop(); build(); k = 0; draw(); };
  const play = () => { if (k >= steps.length){ stop(); return; } k++; draw(); T.later(play, 700); };
  $(el,'.nx').addEventListener('click', () => { stop(); if (k < steps.length) k++; draw(); });
  $(el,'.pl').addEventListener('click', () => { if (playing) return stop(); playing = true; $(el,'.pl').textContent = 'Pause'; play(); });
  $(el,'.rs').addEventListener('click', reset);
  $(el,'.rnd').addEventListener('click', () => { base = Array.from({length:8}, () => 1 + Math.floor(Math.random()*30)); reset(); });
  $(el,'.pre').addEventListener('click', () => { base = [5,1,4,2,8]; reset(); });
  $(el,'.srt').addEventListener('click', () => { base = [1,2,4,5,8]; reset(); });
  const setAlgo = m => { algo = m; $$(el,'.md button').forEach(x => x.setAttribute('aria-pressed', x.dataset.m===m)); reset(); };
  $$(el,'.md button').forEach(b => b.addEventListener('click', () => setAlgo(b.dataset.m)));
  setAlgo(algo);
};

/* ---------- 19. recursion call stack ---------- */
const RECS = {
  factorial: { label:{py:'factorial',java:'factorial'}, inputs:[['n',4]], chain(n){ const f=[]; for(let i=n;i>0;i--) f.push({call:`(${i})`, pend:`${i} * {f}(${i-1})`, comb:r=>i*r, expr:r=>`${i} * ${r}`}); f.push({call:'(0)', base:1, why:'n == 0 → return 1'}); return f; } },
  power: { label:{py:'power',java:'power'}, inputs:[['base',2],['exp',4]], chain(b,e){ const f=[]; for(let i=e;i>0;i--) f.push({call:`(${b}, ${i})`, pend:`${b} * {f}(${b}, ${i-1})`, comb:r=>b*r, expr:r=>`${b} * ${r}`}); f.push({call:`(${b}, 0)`, base:1, why:'exp == 0 → return 1'}); return f; } },
  sum: { label:{py:'sum_list',java:'sumList'}, inputs:[], chain(){ const L=[3,5,2,4], f=[]; for(let i=0;i<L.length;i++){ const r=L.slice(i), x=L[i]; f.push({call:`([${r}])`, pend:`${x} + {f}([${L.slice(i+1)}])`, comb:v=>x+v, expr:v=>`${x} + ${v}`}); } f.push({call:'([])', base:0, why:'empty list → return 0'}); return f; } },
  gcd: { label:{py:'gcd',java:'gcd'}, inputs:[['a',48],['b',18]], chain(a,b){ const f=[]; let g=0; while(b!==0 && g++<20){ const na=b, nb=a%b; f.push({call:`(${a}, ${b})`, pend:`{f}(${na}, ${nb})   [${a} % ${b} = ${nb}]`, comb:r=>r, expr:r=>`${r}`}); a=na; b=nb; } f.push({call:`(${a}, 0)`, base:a, why:`b == 0 → return a (${a})`}); return f; } }
};
WIDGETS.recursion = (el, list) => {
  const T = timers(el);
  const names = (list || 'factorial').split(',');
  let cur = names[0], steps = [], k = 0, playing = false;
  const render = () => {
    const R = RECS[cur];
    el.innerHTML = head('Watch the call stack grow and shrink', 'Each call waits on the stack until the call above it returns. Green = the base case. Press <b>Next step</b>.') + `
    <div class="row">${names.length>1?`<label class="lbl">function <select class="fs">${names.map(n=>`<option value="${n}" ${n===cur?'selected':''}>${RECS[n].label[LANG]}</option>`).join('')}</select></label>`:''}
    ${R.inputs.map(([p,v])=>`<label class="lbl">${p} <input type="number" class="arg" value="${v}" min="0" max="8"></label>`).join('')}
    ${cur==='factorial'?'<label class="lbl"><input type="checkbox" class="nb"> remove the base case</label>':''}</div>
    <div class="grid2"><div><div class="wnote" style="margin-bottom:6px">Top of the call stack (newest call) ↓</div><div class="frames fr"></div></div><div class="tbl tt"></div></div>
    <div class="row"><button class="btn nx" type="button">Next step</button><button class="btn ghost pl" type="button">Play</button><button class="btn ghost rs" type="button">Reset</button></div><div class="msg m"></div>`;
    if ($(el,'.fs')) $(el,'.fs').addEventListener('change', e => { cur = e.target.value; render(); });
    $$(el,'.arg').forEach(x => x.addEventListener('change', reset));
    if ($(el,'.nb')) $(el,'.nb').addEventListener('change', reset);
    $(el,'.nx').addEventListener('click', () => { stop(); if (k < steps.length) k++; draw(); });
    $(el,'.pl').addEventListener('click', () => { if (playing) return stop(); playing = true; $(el,'.pl').textContent = 'Pause'; play(); });
    $(el,'.rs').addEventListener('click', reset);
    reset();
  };
  const build = () => {
    const R = RECS[cur], fn = R.label[LANG];
    const args = $$(el,'.arg').map(x => Math.max(0, Math.min(cur==='gcd'?999:8, Math.trunc(+x.value))));
    const noBase = $(el,'.nb') && $(el,'.nb').checked;
    steps = [];
    if (noBase){
      const fr = []; for (let i=0;i<12;i++){ const n = args[0]-i; fr.push({t:`${fn}(${n})`, p:`${n} * ${fn}(${n-1})`}); steps.push({frames:fr.map(x=>({...x})), rows:fr.map(x=>[x.t,'waiting…']), msg: n===0 ? `${fn}(0) does <b>not</b> stop, because there is no base case. It calls ${fn}(−1)…` : n<0 ? `${fn}(${n})… the numbers keep going down for ever.` : `${fn}(${n}) calls ${fn}(${n-1}).`}); }
      steps.push({frames:[], overflow:true, rows:[], msg:`<b>${py()?'RecursionError: maximum recursion depth exceeded':'StackOverflowError'}</b>. The call stack ran out of memory because nothing ever told the function to stop.`});
      return;
    }
    const ch = R.chain(...args), stack = [];
    ch.forEach((c,i) => { stack.push({t:fn+c.call, p:c.base!=null?`base case: ${c.why}`:c.pend.replace('{f}', fn), base:c.base!=null});
      steps.push({frames:stack.map(x=>({...x})), msg: c.base!=null ? `<b>Base case reached.</b> ${fn}${c.call}: ${c.why}. Now the answers travel back <b>down</b> the stack.` : `${fn}${c.call} cannot answer yet. It calls ${c.pend.replace('{f}', fn).split(/[*+] /).pop().replace(/\s+\[.*$/,'')} and <b>waits</b>.`}); });
    let val = ch[ch.length-1].base;
    stack[stack.length-1].ret = val;
    for (let i=ch.length-2;i>=0;i--){
      const c = ch[i]; const prev = val; val = c.comb(prev);
      stack.pop(); stack[stack.length-1].ret = val; stack[stack.length-1].p = `${c.expr(prev)} = ${val}`;
      steps.push({frames:stack.map(x=>({...x})), msg:`${fn}${c.call} gets ${prev} back and works out ${c.expr(prev)} = <b>${val}</b>.`});
    }
    stack.pop(); steps.push({frames:[], msg:`All calls have returned. Final answer: <b>${val}</b>.`, fin:val});
    const tbl = ch.map(c => [fn+c.call, c.base!=null?String(c.base):'']);
    const vals = []; vals[ch.length-1] = ch[ch.length-1].base;
    for (let i=ch.length-2;i>=0;i--){ vals[i] = ch[i].comb(vals[i+1]); tbl[i][1] = `${ch[i].expr(vals[i+1])} = ${vals[i]}`; }
    steps.table = tbl;
  };
  const draw = () => {
    const s = steps[k-1] || {frames:[], msg:'Press <b>Next step</b> to make the first call.'};
    $(el,'.fr').innerHTML = s.overflow ? '<div class="frame overflow">CALL STACK FULL · program crashed</div>' : s.frames.map((f,i)=>`<div class="frame ${f.base?'base':''} ${i===s.frames.length-1?'top':''}"><span>${f.t}</span><span>${f.ret!=null && i===s.frames.length-1 && !f.base ? `<span class="ret">${f.p}</span>` : esc(f.p)}${f.base?` <span class="ret">→ ${f.ret}</span>`:''}</span></div>`).join('');
    const m = $(el,'.m'); m.innerHTML = s.msg; m.className = 'm msg' + (s.fin!=null ? ' good' : s.overflow ? ' bad' : '');
    if (steps.table){
      const shownReturns = s.fin!=null;
      $(el,'.tt').innerHTML = `<table class="t"><thead><tr><th>Call</th><th>Returns</th></tr></thead><tbody>${steps.table.map(r=>`<tr><td class="mono">${r[0]}</td><td class="mono">${shownReturns?r[1]:'?'}</td></tr>`).join('')}</tbody></table><p class="wnote">The return column fills in when every call has finished.</p>`;
    } else $(el,'.tt').innerHTML = '<p class="wnote">No base case means no trace table: the calls never finish.</p>';
    $(el,'.nx').disabled = k >= steps.length;
  };
  const stop = () => { playing = false; T.clear(); const p = $(el,'.pl'); if (p) p.textContent = 'Play'; };
  const reset = () => { stop(); build(); k = 0; draw(); };
  const play = () => { if (k >= steps.length){ stop(); return; } k++; draw(); T.later(play, 900); };
  render(); onLang(el, render);
};

    {q:'A school app stores your <b>name</b>, <b>age</b>, <b>height in metres</b> and <b>whether you have paid for lunch</b>. For each one, is it a whole number, a decimal number, text, or yes/no?', a:'Name = text. Age = whole number. Height = decimal number (e.g. 1.62). Paid for lunch = yes/no.'},
    {q:'What is the difference between <code>7</code> and <code>"7"</code>?', a:'<code>7</code> is a number you can do maths with. <code>"7"</code> is text: the character seven, like a letter. You cannot add 1 to it directly.'},
    {q:'A box labelled <b>score</b> has <b>10</b> in it. You put <b>15</b> into the box. What is in the box now?', a:'Just <b>15</b>. The 10 is replaced. A box (variable) holds one value at a time.'},
    {q:'Write the steps for making a cup of tea. Does the order matter? Give one example.', a:'Yes. You must boil the water before you pour it. Computers also follow instructions strictly in order.'}
  ],
  teacherDoNow:'<p>Students may have no coding background, so this Do Now is everyday thinking. Take 2–3 answers for Q1 and write the four categories on the board: they become the data types in a few minutes.</p>',
  teacher:[
    'Bring (or draw) three boxes labelled <b>name</b>, <b>age</b>, <b>paid</b>. Put a card in each. Ask: “What happens if I put a new card in <b>age</b>?” This is the whole idea of a variable.',
    'Say out loud: <b>= means “store”</b>, not “equals”. Read <code>age = 16</code> as “age <b>becomes</b> 16”. This prevents the biggest beginner misconception.',
    'Use the <b>Try it</b> box live on the projector. Ask students to shout a value, then predict its type before you press Store.',
    'If your class uses Java, point out that Java makes you write the type; Python works it out for you. Both still have types.',
    'Global vs local only needs the picture today. It is revisited properly in the Functions lesson (B2.3.4).'
  ],
  learn:[
    {h:'What is a variable?', html:`
      ${ANALOGY('Analogy','Think of the lockers in your school corridor. Each locker has a <b>label</b> (its name) and you can put <b>one thing</b> in it. You can take the thing out and put something else in. A variable works the same way, but the lockers are in the computer’s memory.')}
      <div class="prose"><p>A <b>variable</b> is a named place in memory that stores a value. We give it a name so we can find the value again later. The word “variable” means “able to change”: the value can be replaced while the program runs.</p></div>
      ${C(R`
        age = 16              # make a box called age and store 16
        name = "Aisha"        # text goes in quotes
        print(name)           # shows: Aisha
        print(age)            # shows: 16`, R`
        int age = 16;            // make a box called age, type int, store 16
        String name = "Aisha";   // text goes in double quotes
        System.out.println(name);   // shows: Aisha
        System.out.println(age);    // shows: 16`)}
      ${W('vars')}`},
    {h:'The five data types you need', html:`
      <div class="prose"><p>Every value has a <b>data type</b>. The type tells the computer how much memory to use and what you are allowed to do with the value. You can multiply two numbers, but you cannot multiply two names.</p></div>
      ${TABLE(['Type','What it stores','Example values',P('Python name','Java name'),'Real use'],[
        ['Integer','Whole numbers, positive or negative','<code>16</code>, <code>-5</code>, <code>0</code>',P('<code>int</code>','<code>int</code>'),'Age, number of students'],
        ['Decimal (real)','Numbers with a fractional part','<code>3.14</code>, <code>-2.5</code>',P('<code>float</code>','<code>double</code> (or <code>float</code>)'),'Price, height, temperature'],
        ['Character','A single letter or symbol',`<code>'A'</code>, <code>'$'</code>`,P('no separate type: a <code>str</code> of length 1','<code>char</code> (single quotes)'),'Grade letter, a key pressed'],
        ['String','A sequence of characters','<code>"Hello"</code>, <code>"050 123 4567"</code>',P('<code>str</code>','<code>String</code> (capital S)'),'Name, email, phone number'],
        ['Boolean','Only True or False',P('<code>True</code>, <code>False</code>','<code>true</code>, <code>false</code>'),P('<code>bool</code>','<code>boolean</code>'),'Logged in? Paid? Passed?']
      ])}
      ${CALL('','Phone numbers are strings, not integers','You never do maths with a phone number, and it can start with 0 (an integer would drop the leading 0). If you would never add it up, it is probably a string.')}
      <div class="only-java">${CALL('warn','Java has eight “primitive” types','You mainly need <code>int</code>, <code>double</code>, <code>char</code> and <code>boolean</code>. The others store numbers of different sizes: <code>byte</code> (−128 to 127), <code>short</code>, <code>long</code> (very big whole numbers) and <code>float</code> (a less precise decimal). <code>String</code> is not a primitive: it is a class, which is why it has a capital S.')}</div>
      <div class="only-py">${CALL('warn','Python works out the type for you','You never write the type in Python. It looks at the value: <code>16</code> becomes an <code>int</code>, <code>"16"</code> becomes a <code>str</code>. You can check with <code>type(age)</code>.')}</div>`},
    {h:'Changing a variable: = means “store”', html:`
      <div class="prose"><p>The <code>=</code> sign is called the <b>assignment operator</b>. The computer works out the right-hand side first, then stores the answer in the box on the left. So <code>score = score + 5</code> is not nonsense: it means “take what is in score, add 5, put the answer back in score”.</p></div>
      ${C(R`
        score = 10
        score = score + 5     # right side first: 10 + 5 = 15
        score = score * 2     # 15 * 2 = 30
        print(score)          # 30`, R`
        int score = 10;
        score = score + 5;    // right side first: 10 + 5 = 15
        score = score * 2;    // 15 * 2 = 30
        System.out.println(score);   // 30`)}
      ${TABLE(['Line','score after the line runs'],[['1','10'],['2','15'],['3','30']],[0,1])}
      <div class="prose"><p>Printing text and a variable together:</p></div>
      ${C(R`
        age = 16
        print("You are", age)            # You are 16
        print(f"Next year you will be {age + 1}")   # f-string`, R`
        int age = 16;
        System.out.println("You are " + age);              // You are 16
        System.out.println("Next year you will be " + (age + 1));`)}`},
    {h:'Global and local variables', html:`
      ${ANALOGY('Analogy','A notice in the school <b>main corridor</b> can be read by everyone: that is a <b>global</b> variable. A note written on the board inside <b>one classroom</b> can only be read by people in that room: that is a <b>local</b> variable. When the lesson ends, the board is wiped.')}
      <div class="grid2"><div class="mini"><h4>Global variable</h4><p>Made outside every function. Any part of the program can read it. It lasts until the program ends.</p></div>
      <div class="mini"><h4>Local variable</h4><p>Made inside a function. Only that function can use it. It is destroyed when the function finishes.</p></div></div>
      ${W('scope')}`}
  ],
  mistakes:[
    ['Forgetting quotes around text', P('<code>name = Aisha</code> makes Python look for a variable called Aisha. Write <code>name = "Aisha"</code>.','<code>String name = Aisha;</code> makes Java look for a variable called Aisha. Write <code>"Aisha"</code>.')],
    ['Putting numbers in quotes', 'If you write <code>age = "16"</code>, age is text. <code>age + 1</code> will then fail or behave strangely.'],
    ['Illegal names', 'Names cannot start with a digit, contain spaces or hyphens, or be a keyword. Use <code>first_name</code> or <code>firstName</code>.'],
    ['Wrong Boolean spelling', P('Python needs capital letters: <code>True</code> and <code>False</code>.','Java needs lowercase: <code>true</code> and <code>false</code>.')]
  ],
  hinge:[
    {q:'Which data type is best for the price of a sandwich, <b>AED 12.50</b>?', o:['Integer','Decimal (float / double)','Boolean','Character'], a:1, why:'A price has a fractional part (.50), so it needs a decimal type. An integer would lose the 50 fils.'},
    {q:`What is stored in x after these three lines?<br>${P('<code>x = 5</code><br><code>x = x + 3</code><br><code>x = 2</code>','<code>int x = 5;</code><br><code>x = x + 3;</code><br><code>x = 2;</code>')}`, o:['10','8','2','5'], a:2, why:'x becomes 5, then 8, then is replaced by 2. Only the last assignment counts.'}
  ],
  task1:{title:'Fill the boxes', intro:'Work on your own. Write your answers in your book or in an editor. Check each answer before moving on.', qs:[
    {lv:1, q:`Choose a data type and write the line of code that creates each variable:<br>(a) a student’s name, Omar &nbsp; (b) number of siblings, 2 &nbsp; (c) body temperature, 36.6 &nbsp; (d) passed the exam, yes &nbsp; (e) grade letter, B`, a:C(R`
      name = "Omar"         # str
      siblings = 2          # int
      temperature = 36.6    # float
      passed = True         # bool
      grade = "B"           # str (Python has no char type)`, R`
      String name = "Omar";
      int siblings = 2;
      double temperature = 36.6;
      boolean passed = true;
      char grade = 'B';`)},
    {lv:1, q:'Which of these are <b>illegal</b> variable names, and why? &nbsp; <code>2ndPlace</code> &nbsp; <code>total_score</code> &nbsp; <code>my-age</code> &nbsp; <code>class</code> &nbsp; <code>firstName</code>', a:'<code>2ndPlace</code> starts with a digit. <code>my-age</code> has a hyphen (it means minus). <code>class</code> is a keyword in both languages. <code>total_score</code> and <code>firstName</code> are fine.'},
    {lv:2, q:`Predict the output, then check by running it:${C(R`
      a = 10
      b = 3
      a = a + b
      b = a - b
      print(a, b)`, R`
      int a = 10;
      int b = 3;
      a = a + b;
      b = a - b;
      System.out.println(a + " " + b);`)}`, a:'<b>13 10</b>. a becomes 10 + 3 = 13. Then b becomes 13 − 3 = 10.'},
    {lv:2, q:'Write a program that stores your name and your age in two variables, then prints a sentence like <code>Sara will be 17 next year</code>. The 17 must be worked out by the program.', a:C(R`
      name = "Sara"
      age = 16
      print(name, "will be", age + 1, "next year")`, R`
      String name = "Sara";
      int age = 16;
      System.out.println(name + " will be " + (age + 1) + " next year");`)+'<p>In Java the brackets around <code>(age + 1)</code> matter. Without them Java joins “16” and “1” as text and prints 161.</p>'},
    {lv:3, q:'Two variables hold <code>cup1 = "juice"</code> and <code>cup2 = "milk"</code>. Write code that swaps them, so cup1 holds milk and cup2 holds juice. Why do you need a third variable?', a:C(R`
      cup1 = "juice"
      cup2 = "milk"
      temp = cup1      # keep a copy of juice
      cup1 = cup2      # cup1 now milk
      cup2 = temp      # cup2 now juice`, R`
      String cup1 = "juice";
      String cup2 = "milk";
      String temp = cup1;
      cup1 = cup2;
      cup2 = temp;`)+'<p>If you write <code>cup1 = cup2</code> first, “juice” is overwritten and lost. The temp variable is the empty third cup.</p>'}
  ]},
  task2:{title:'Design the Lunch Card app', scenario:`<p>The school canteen is launching a <b>Lunch Card</b> app. For every student it must store: a student ID like <code>S2041</code>, full name, year group, card balance in AED, whether they have a nut allergy, and a meal-plan letter (A, B or C).</p><p>The app has two features: <b>top up</b> the card with an amount, and <b>buy a meal</b> with a price.</p>`,
    steps:[
      'Make a <b>data dictionary</b> table with four columns: variable name · data type · example value · why you chose that type.',
      'Agree on legal, meaningful variable names. Use one naming style for all of them.',
      'Write the code that creates all six variables with example values.',
      'Decide which variables should be <b>global</b> and which should be <b>local</b> inside the top-up and buy-meal features. Explain why in one sentence each.',
      'Be ready to defend one tricky choice to the class, for example the student ID or the balance.'
    ],
    extension:'Write a line that reduces the balance when a meal costing AED 14.50 is bought, and a line that prints the new balance with a message.',
    answer:`${TABLE(['Variable','Type','Example','Reason'],[
      ['studentId / student_id','String','"S2041"','Contains a letter; never used for maths.'],
      ['fullName / full_name','String','"Mariam Khan"','Text.'],
      ['yearGroup / year_group','Integer','12','Whole number; you might compare it (e.g. year >= 12).'],
      ['balance','Decimal','45.50','Money has fils, so it needs decimals.'],
      ['nutAllergy / has_nut_allergy','Boolean','True / true','Only two possible answers.'],
      ['mealPlan / meal_plan','Character (Java) / str (Python)',"'B'",'One letter.']
    ])}<p>The student record can be global (every feature needs it). The top-up <b>amount</b> and the meal <b>price</b> should be local to their feature: they are only needed while that feature runs.</p>`},
  home:[
    {q:'<span class="cmd">State</span> the most appropriate data type for each of the following: (a) the number of students in a class; (b) the average height of the class; (c) whether a door is locked.', m:3, ms:'<ul><li>(a) integer / int</li><li>(b) decimal / float / double / real</li><li>(c) Boolean</li></ul>'},
    {q:'<span class="cmd">Outline</span> the difference between a local variable and a global variable.', m:2, ms:'<ul><li>A local variable is declared inside a function/method and can only be used there [1];</li><li>a global variable is declared outside all functions and can be accessed anywhere in the program [1].</li></ul>'},
    {q:`<span class="cmd">Trace</span> the following code and <span class="cmd">state</span> the output.${C(R`
      a = 7
      b = 2
      c = a * b
      a = c - a
      print(a, b, c)`, R`
      int a = 7;
      int b = 2;

      a = c - a;
      System.out.println(a + " " + b + " " + c);`)}`, m:3, ms:'<ul><li>c = 14 [1];</li><li>a = 14 − 7 = 7 [1];</li><li>output: <b>7 2 14</b> [1].</li></ul>'},
    {q:`<span class="cmd">Identify</span> two errors in this code and explain how to fix each one.${C(R`
      1st_name = "Ana"
      age = "15"
      print(age + 1)`, R`
      String name = Ana;

    {q:'<span class="cmd">Construct</span> code that stores the price of a notebook (12.50) and the quantity bought (3), calculates the total cost and outputs <code>Total: 37.5</code>.', m:3, ms:`<ul><li>price stored as a decimal and quantity as an integer [1];</li><li>total calculated as price × quantity [1];</li><li>output joins the text and the total correctly [1].</li></ul>${C(R`

/* ---------- Lesson 2: String manipulation ---------- */
L({
  id:'strings', unit:'B2.1', code:'B2.1.2', title:'String manipulation',
  tagline:'A string is a row of characters, each in a numbered box. Programs cut strings up, join them and change them.',
  objectives:[
    'Find the length of a string and pick out one character using its index.',
    'Extract part of a string (a substring).',
    'Join strings together (concatenation), including with numbers.',
    'Use replace and other common string methods.'
  ],
  keywords:[
    ['String','A sequence of characters, such as a word or sentence.'],
    ['Index','The position number of a character. The first is 0.'],
    ['Substring','A part of a string, for example “COM” from “COMPUTER”.'],
    ['Concatenation','Joining strings end to end with <code>+</code>.'],
    ['Method','A built-in action you call on a string with a dot, e.g. <code>.upper()</code>.'],
    ['Length','How many characters the string contains.']
  ],
  doNow:[
    {q:'From last lesson: what data type is <code>"050 123 4567"</code>, and why is it not an integer?', a:'A string. Phone numbers are not used for maths and can start with 0 or contain spaces.'},
    {q:'What does <code>=</code> mean in <code>total = total + 2</code>?', a:'“Store”. Work out total + 2, then put the answer back into total.'},
    {q:'How many letters are in <b>COMPUTER</b>? If you number the letters starting from <b>0</b>, which letter is number 3?', a:'8 letters. Numbering C=0, O=1, M=2, <b>P=3</b>.'},
    {q:'When you sign up for an app with first name <b>Sara</b> and last name <b>Ali</b>, it says “Welcome, Sara Ali!”. How do you think it built that sentence?', a:'It joined pieces of text together: "Welcome, " + first name + " " + last name + "!". That joining is called concatenation.'}
  ],
  teacher:[
    'Write COMPUTER on the board in boxes and number them 0–7 underneath. Ask “Why does the computer start at 0?” Answer: the index is how many steps from the start.',
    'Spend the most time on the <b>end is not included</b> rule for slicing/substring. Use the slider widget: start 0, end 3 gives three characters.',
    'Common misconception: the last index is the length. Show that index 8 in COMPUTER does not exist.',
    'Python students: show negative indexes ([-1] is the last character). Java students: show that <code>charAt</code> gives a <code>char</code>, and <code>substring</code> gives a <code>String</code>.'
  ],
  learn:[
    {h:'A string is a row of numbered boxes', html:`
      ${ANALOGY('Analogy','Think of a train. Each carriage holds one character. The carriages are numbered from <b>0</b>, so the first carriage is carriage 0. To find a carriage, you use its number: its <b>index</b>.')}
      ${C(R`
        word = "COMPUTER"
        print(len(word))    # 8 characters
        print(word[0])      # C   (first)
        print(word[3])      # P
        print(word[-1])     # R   (Python: -1 is the last)`, R`
        String word = "COMPUTER";
        System.out.println(word.length());   // 8 characters
        System.out.println(word.charAt(0));  // C   (first)
        System.out.println(word.charAt(3));  // P
        System.out.println(word.charAt(word.length() - 1));  // R (last)`)}
      ${CALL('','The last index is always length − 1','COMPUTER has 8 characters, so the indexes go from 0 to 7. Asking for index 8 crashes the program.')}`},
    {h:'Cutting out a substring', html:`
      <div class="prose"><p>To take part of a string, give a <b>start</b> index and an <b>end</b> index. You get the characters from start up to, <b>but not including</b>, end. A useful check: end − start = number of characters you get.</p></div>
      ${C(R`
        word = "COMPUTER"
        print(word[0:3])    # COM   (indexes 0, 1, 2)
        print(word[3:6])    # PUT
        print(word[5:])     # TER   (from 5 to the end)
        print(word[:4])     # COMP  (from the start to 4)`, R`
        String word = "COMPUTER";
        System.out.println(word.substring(0, 3));  // COM  (indexes 0, 1, 2)
        System.out.println(word.substring(3, 6));  // PUT
        System.out.println(word.substring(5));     // TER  (from 5 to the end)`)}
      ${W('strings')}`},
    {h:'Joining strings: concatenation', html:`
      <div class="prose"><p>The <code>+</code> sign joins strings end to end. Spaces are not added for you, so you must include them.</p></div>
      ${C(R`
        first = "Sara"
        last = "Ali"
        full = first + " " + last      # "Sara Ali"
        print("Welcome, " + full + "!")

        age = 16
        print("Age: " + str(age))      # str() turns the number into text
        # print("Age: " + age)  would crash: TypeError`, R`
        String first = "Sara";
        String last = "Ali";
        String full = first + " " + last;     // "Sara Ali"
        System.out.println("Welcome, " + full + "!");

        int age = 16;
        System.out.println("Age: " + age);    // Java turns 16 into text for you
        // also works: first.concat(" ").concat(last)`)}
      <div class="only-py">${CALL('warn','Python will not join text and numbers','<code>"Age: " + 16</code> gives a <b>TypeError</b>. Convert with <code>str(16)</code>, use a comma in <code>print</code>, or use an f-string: <code>f"Age: {age}"</code>.')}</div>
      <div class="only-java">${CALL('warn','Watch out for numbers next to each other','<code>"Total: " + 2 + 3</code> gives <b>Total: 23</b>, because Java joins left to right as text. Write <code>"Total: " + (2 + 3)</code> to get 5.')}</div>`},
    {h:'Replacing and other useful methods', html:`
      <div class="prose"><p>A <b>method</b> is an action built into strings. You call it with a dot. Methods give you a <b>new</b> string. The original is not changed unless you store the result.</p></div>
      ${TABLE(['Task',P('Python','Java'),'Result for <code>"Hello World"</code>'],[
        ['Replace part of it',P('<code>s.replace("World", "Dubai")</code>','<code>s.replace("World", "Dubai")</code>'),'"Hello Dubai"'],
        ['Capital letters',P('<code>s.upper()</code>','<code>s.toUpperCase()</code>'),'"HELLO WORLD"'],
        ['Small letters',P('<code>s.lower()</code>','<code>s.toLowerCase()</code>'),'"hello world"'],
        ['Find where something starts',P('<code>s.find("W")</code>','<code>s.indexOf("W")</code>'),'6 (−1 if not found)'],
        ['Remove spaces at the ends',P('<code>s.strip()</code>','<code>s.trim()</code>'),'"Hello World"'],
        ['Split into parts',P('<code>s.split(" ")</code>','<code>s.split(" ")</code>'),'["Hello", "World"]']
      ])}
      ${C(R`
        email = "sara.ali@school.ae"
        at = email.find("@")          # 8
        username = email[0:at]        # "sara.ali"
        domain = email[at + 1:]       # "school.ae"
        print(username.upper())       # SARA.ALI`, R`
        String email = "sara.ali@school.ae";
        int at = email.indexOf("@");            // 8
        String username = email.substring(0, at);    // "sara.ali"
        String domain = email.substring(at + 1);     // "school.ae"
        System.out.println(username.toUpperCase());  // SARA.ALI`,'Pulling a username out of an email address')}`}
  ],
  mistakes:[
    ['Counting from 1', 'The first character is index 0. In “CAT”, index 1 is A, not C.'],
    ['Including the end index', P('<code>"CAT"[0:2]</code> is “CA”. The character at index 2 is not included.','<code>"CAT".substring(0, 2)</code> is “CA”. The character at index 2 is not included.')],
    ['Forgetting to store the result', P('<code>name.upper()</code> on its own changes nothing. Write <code>name = name.upper()</code>.','<code>name.toUpperCase();</code> on its own changes nothing. Write <code>name = name.toUpperCase();</code>.')],
    ['No spaces when joining', '<code>"Sara" + "Ali"</code> gives “SaraAli”. Add <code>" "</code> between them.']
  ],
  hinge:[
    {q:`<code>word = "BANANA"</code>. What is ${P('<code>word[1:4]</code>','<code>word.substring(1, 4)</code>')}?`, o:['"BAN"','"ANA"','"ANAN"','"NAN"'], a:1, why:'Indexes 1, 2 and 3 are A, N, A. Index 4 is not included.'},
    {q:'<code>city = "Dubai"</code>. What is the index of the last character?', o:['5','4','6','−1 only'], a:1, why:'There are 5 characters, so the indexes are 0 to 4. Last index = length − 1.'}
  ],
  task1:{title:'String surgeon', intro:'Use <code>s = "INTERNATIONAL"</code> for questions 1–3. Write the code and the expected output.', qs:[
    {lv:1, q:'Output the length of <code>s</code>, its first character and its last character.', a:C(R`
      s = "INTERNATIONAL"
      print(len(s))      # 13
      print(s[0])        # I
      print(s[len(s)-1]) # L   (or s[-1])`, R`
      String s = "INTERNATIONAL";
      System.out.println(s.length());           // 13
      System.out.println(s.charAt(0));          // I

  task2:{title:'School ID card generator', scenario:`<p>The school office prints ID cards and creates logins for new students. They give you each student’s <b>full name</b> and <b>year of birth</b>, for example <code>"mariam khan"</code> and <code>"2010"</code>.</p><p>The office rules are:</p><ul><li>Display name on the card: every word starts with a capital, e.g. <b>Mariam Khan</b>.</li><li>Username: first letter of first name + whole surname + last two digits of birth year, all lowercase, e.g. <b>mkhan10</b>.</li><li>Email: username + <b>@school.ae</b>.</li><li>Phone numbers on the card are partly hidden: <code>0501234567</code> becomes <b>050****567</b>.</li></ul>`,

L({

    {h:'try and '+'except / catch', html:`
      <div class="prose"><p>Put the risky code inside a <b>try</b> block. Underneath, write what to do if a particular exception happens. If no exception happens, the ${P('except','catch')} block is skipped.</p></div>

        try:
            result = 10 / 0
            print(result)              # never runs
        except ZeroDivisionError:

            print("Calculation finished.")

      ${W('tryflow')}`},

      ${CALL('','Catch the specific exception',P('Writing <code>except ZeroDivisionError:</code> is better than a bare <code>except:</code>. A bare except hides other mistakes you would want to know about.','Catching <code>ArithmeticException</code> is better than catching <code>Exception</code>. Catching everything hides other mistakes you would want to know about.'))}`},

    {h:'Real use: checking what the user types', html:`

    {h:'How to fill in a trace table', html:`
      <div class="prose"><ol><li>Make one column for <b>each variable</b>, one for <b>each condition</b>, and one for the <b>output</b>.</li><li>Follow the code <b>line by line</b>, exactly as the computer would.</li><li>Only write a value when it <b>changes</b>. Start a new row for each pass of the loop.</li><li>Stop when the loop condition becomes false.</li></ol></div>
      ${W('trace','evens')}
      ${CALL('good','Why examiners love trace tables','A trace table proves you understand what each line does. It is also the fastest way to find a logic error by hand: the row where the value looks wrong is where the bug is.')}`},
    {h:'Print statements: let the program tell you', html:`
      <div class="prose"><p>This function should give the average of the marks <code>[80, 70, 90, 60]</code>, which is 75. It prints 100. Something is wrong.</p></div>
      ${C(R`
        def average(marks):
            total = 0
            for m in marks:
                total = total + m
            print("DEBUG total =", total, "count =", len(marks))   # clue!
            return total / 3

        print(average([80, 70, 90, 60]))`, R`
        static double average(int[] marks) {
            int total = 0;
            for (int m : marks) {
                total = total + m;
            }
            System.out.println("DEBUG total = " + total + " count = " + marks.length); // clue!
            return total / 3.0;
        }`)}
      <div class="out">DEBUG total = 300 count = 4
100.0</div>
      <div class="prose"><p>The clue shows the total is right (300) but there are <b>4</b> marks, not 3. The bug: dividing by a fixed 3. Fix it by dividing by ${P('<code>len(marks)</code>','<code>marks.length</code>')}. Then <b>remove the debug print</b>.</p></div>`},
    {h:'Breakpoints and stepping in your editor', html:`
      <div class="grid2">
        <div class="prose"><p>Every proper code editor has a <b>debugger</b>.</p><ol><li>Click in the margin next to a line number. A red dot appears: that is a <b>breakpoint</b>.</li><li>Start the program in <b>debug</b> mode. It pauses when it reaches the dot.</li><li>The <b>variables panel</b> shows every variable and its value right now.</li><li>Press <b>Step over</b> to run the next line, or <b>Step into</b> to go inside a function call.</li></ol></div>
        <div class="code"><div class="code-head"><span class="lt">DEBUGGER</span><span class="cap">paused at line 4</span></div><pre><span class="ln">1  count = 0</span><span class="ln">2  total = 0</span><span class="ln">3  while total &lt; 10:</span><span class="ln active">4 ● count = count + 1</span><span class="ln">5      ...</span>
<span class="ln t-com">─── Variables ───</span><span class="ln">count  2</span><span class="ln">total  2</span></pre></div>
      </div>`},
    {h:'A debugging routine you can always follow', html:`
      ${TABLE(['Step','What to do'],[
        ['1. Read','Read the error message. It names the kind of error and the line number.'],
        ['2. Locate','Go to that line. For a logic error, find the first place a value looks wrong.'],
        ['3. Predict','Say what the value <i>should</i> be at that point.'],
        ['4. Inspect','Use a trace table, a print or a breakpoint to see what it really is.'],
        ['5. Fix','Change one thing at a time.'],
        ['6. Retest','Run again with the same input and with new inputs.']
      ])}
      <div class="only-py">${C(R`
        Traceback (most recent call last):
          File "shop.py", line 7, in <module>
            total = price * qty
        NameError: name 'qty' is not defined`, null, 'reading an error message')}</div>
      <div class="only-java">${C(null, R`
        Shop.java:7: error: cannot find symbol
                total = price * qty;
                                ^
          symbol:   variable qty`, 'reading an error message')}</div>
      <p class="wnote">The message tells you the file, the line (7) and the problem: <code>qty</code> was never created. Perhaps it was spelled <code>quantity</code> earlier.</p>`}
  ],
  mistakes:[
    ['Guessing instead of checking', 'Changing lines at random often adds new bugs. Collect evidence first.'],
    ['Skipping rows in a trace table', 'Write a new row for every pass of the loop, even if nothing seems to change.'],
    ['Leaving debug prints in', 'Remove them when the bug is fixed, or the user will see them.'],
    ['Changing many things at once', 'If it starts working, you will not know which change fixed it.']
  ],
  hinge:[
    {q:'Which technique pauses a program at a chosen line so that you can inspect the variables?', o:['A trace table','A breakpoint','A comment','Compiling the code'], a:1, why:'A breakpoint pauses execution at a line. A trace table is done by hand, and compiling only checks syntax.'},
    {q:`What is the value of <b>total</b> when this loop finishes?${C(R`
      total = 0
      for i in range(1, 4):
          total = total + i`, R`
      int total = 0;
      for (int i = 1; i < 4; i++) {
          total = total + i;
      }`)}`, o:['3','4','6','10'], a:2, why:'i takes the values 1, 2, 3 (4 is not included). 0+1 = 1, 1+2 = 3, 3+3 = 6.'}
  ],
  task1:{title:'Trace it, then fix it', intro:'Draw your trace tables neatly in your book. Use the widget above only to check.', qs:[
    {lv:1, q:`Complete a trace table (columns: n, n &lt; 50?, steps, output) for this code.${C(R`
      n = 1
      steps = 0
      while n < 50:
          n = n * 2
          steps = steps + 1
      print(steps, n)`, R`
      int n = 1;
      int steps = 0;
      while (n < 50) {
          n = n * 2;
          steps = steps + 1;
      }
      System.out.println(steps + " " + n);`)}`, a:W('trace','doubling')+'<p>Output: <b>6 64</b>.</p>'},
    {lv:2, q:`This code should print the biggest mark (90). Trace it with columns m, m &gt; best?, best. Does it work?${C(R`
      marks = [56, 81, 47, 90, 73]
      best = marks[0]
      for m in marks:
          if m > best:
              best = m
      print(best)`, R`
      int[] marks = {56, 81, 47, 90, 73};
      int best = marks[0];
      for (int m : marks) {
          if (m > best) {
              best = m;
          }
      }
      System.out.println(best);`)}`, a:W('trace','maxfind')+'<p>Yes, it prints 90.</p>'},
    {lv:3, q:`A student changed line 2 to ${P('<code>best = 0</code>','<code>int best = 0;</code>')}. For the marks above it still prints 90. Find a list of numbers where this version gives the <b>wrong</b> answer, and explain why.`, a:'Any list of all negative numbers, e.g. temperatures [−5, −2, −9]. best starts at 0, no value is bigger than 0, so it prints 0, which is not in the list. Starting with the first item is always safe.'}
  ]},
  task2:{title:'Sports Day bug hunt', scenario:`<p>The PE department wrote a program for Sports Day. It should add up the points for each house and announce the winner. It has <b>three bugs</b>: one syntax error, one runtime error and one logic error.</p>${C(R`
      houses = ["Falcon", "Oryx", "Gazelle"]
      points = [42, 57, 39]
      bonus = int(input("Bonus points for best behaviour: "))
      points[1] = points[1] + bonus

      best = 0
      for i in range(1, len(houses)):
          if points[i] < points[best]
              best = i
      print("Winner:", houses[best], "with", points[best] + " points")`, R`
      String[] houses = {"Falcon", "Oryx", "Gazelle"};
      int[] points = {42, 57, 39};
      int bonus = Integer.parseInt(sc.nextLine());
      points[1] = points[1] + bonus;

      int best = 0;
      for (int i = 1; i <= houses.length; i++) {
          if (points[i] < points[best])
              best = i
      }
      System.out.println("Winner: " + houses[best] + " with " + points[best] + " points");`)}<p>The house with the <b>most</b> points should win.</p>`,
    steps:[
      'Read the code together. Each person marks any line they think is suspicious.',
      'Find the <b>syntax</b> error first. Explain how the computer would tell you about it.',
      'Find the <b>runtime</b> error. Say which input or which loop pass makes it happen.',
      'Find the <b>logic</b> error or the risky input. Use a trace table to prove your answer.',
      'Write the corrected program and a three-row test table: normal bonus, bonus 0, bonus typed as letters.'
    ],
    extension:'Add exception handling so that typing letters for the bonus gives a friendly message and uses a bonus of 0.',
    answer:P(`<ul><li><b>Syntax:</b> missing colon at the end of the <code>if</code> line.</li><li><b>Runtime:</b> <code>points[best] + " points"</code> adds an int to a str → TypeError. Fix with a comma or <code>str()</code>. (Typing letters for the bonus also gives a ValueError.)</li><li><b>Logic:</b> <code>&lt;</code> finds the <b>lowest</b> score, so Gazelle (39) “wins”. It should be <code>&gt;</code>. A trace table shows best changing to 2 when it should not.</li></ul>`,`<ul><li><b>Syntax:</b> missing semicolon after <code>best = i</code>.</li><li><b>Runtime:</b> <code>i &lt;= houses.length</code> lets i reach 3, so <code>points[3]</code> throws ArrayIndexOutOfBoundsException. Use <code>&lt;</code>. Letters for the bonus throw NumberFormatException.</li><li><b>Logic:</b> <code>&lt;</code> finds the <b>lowest</b> score, so Gazelle (39) “wins”. It should be <code>&gt;</code>. A trace table shows best changing to 2 when it should not.</li></ul>`)},
  home:[
    {q:'<span class="cmd">Outline</span> two debugging techniques other than trace tables.', m:4, ms:'<ul><li>print statements [1]: output the values of variables at chosen points to see how they change [1];</li><li>breakpoints [1]: pause execution at a line so variables can be inspected in the debugger [1];</li><li>(also accept: stepping through code line by line [1] + description [1]).</li></ul>'},
    {q:`<span class="cmd">Construct</span> a trace table for the following code.${C(R`
      x = 10
      y = 1
      while x > 3:
          x = x - 3
          y = y * 2
      print(x, y)`, R`
      int x = 10;
      int y = 1;
      while (x > 3) {
          x = x - 3;
          y = y * 2;
      }
      System.out.println(x + " " + y);`)}`, m:4, ms:`${TABLE(['x','y','x > 3','output'],[['10','1','True',''],['7','2','True',''],['4','4','True',''],['1','8','False','1 8']],[0,1,2,3])}<ul><li>correct columns [1]; x values 7, 4, 1 [1]; y values 2, 4, 8 [1]; output 1 8 [1].</li></ul>`},
    {q:'<span class="cmd">Explain</span> why a trace table is useful for finding logic errors.', m:2, ms:'<ul><li>logic errors produce no error message, so the programmer must find where the values go wrong [1];</li><li>a trace table records the value of each variable step by step, showing the exact point where the actual value differs from the expected value [1].</li></ul>'},
    {q:`The following code should output the average of three numbers. <span class="cmd">Identify</span> the logic error and <span class="cmd">state</span> the correction.${C(R`
      a = 6
      b = 8
      c = 10
      avg = a + b + c / 3
      print(avg)`, R`
      double a = 6, b = 8, c = 10;
      double avg = a + b + c / 3;
      System.out.println(avg);`)}`, m:2, ms:'<ul><li>only c is divided by 3 because division happens before addition (operator precedence) [1];</li><li>add brackets: <code>(a + b + c) / 3</code> [1].</li></ul>'}
  ]
});

/* ---------- Lesson 5: Static and dynamic data structures ---------- */
L({
  id:'static-dynamic', unit:'B2.2', code:'B2.2.1', title:'Static and dynamic data structures',
  tagline:'Some containers have a fixed size, like an egg box. Others grow and shrink, like a shopping list. Choosing the right one matters.',
  objectives:[
    'Explain what a data structure is.',
    'Describe static data structures: fixed size, memory reserved before the program runs.',
    'Describe dynamic data structures: size changes while the program runs.',
    'Compare the two and choose the right one for a problem.'
  ],
  keywords:[
    ['Data structure','A way of organising many pieces of data so they are easy to store and use.'],
    ['Static','Fixed size. Memory is set aside at compile time and cannot change.'],
    ['Dynamic','Size can change at runtime. Memory is given and taken back as needed.'],
    ['Compile time','When the code is turned into a program, before it runs.'],
    ['Runtime','While the program is running.'],
    ['Contiguous','Stored side by side in one unbroken block of memory.']
  ],
  doNow:[
    {q:'What is the index of the first character in a string?', a:'0.'},
    {q:'Name the error that stops a program when you divide by zero, in the language you are learning.', a:'Python: ZeroDivisionError. Java: ArithmeticException.'},
    {q:'You have an egg box with 6 places and you buy 8 eggs. What is the problem? What could you do?', a:'Two eggs do not fit. You need a new, bigger box and must move all the eggs into it.'},
    {q:'You keep 30 students’ marks in 30 separate variables: <code>mark1</code>, <code>mark2</code>… What is annoying about this?', a:'Lots of typing, and you cannot loop through them. A data structure keeps them together under one name.'}
  ],
  teacher:[
    'Bring an egg box and a sheet of paper. Ask students to add items to both. The box fills up; the list just gets longer. That is the whole lesson in 60 seconds.',
    'Draw memory as a row of numbered boxes (addresses). Show a static array as one unbroken block. Show a linked list as boxes scattered around with arrows.',
    'Keep the language link clear: Python lists are dynamic. Java has both: <code>int[]</code> is static, <code>ArrayList</code> is dynamic.',
    'Exam focus: memory allocation, resizing, speed of access, wasted memory. The comparison table is worth copying into books.'
  ],
  learn:[
    {h:'What is a data structure?', html:`
      <div class="prose"><p>A <b>data structure</b> is a container that keeps many pieces of data organised under one name. Different containers suit different jobs, just like in real life.</p></div>
      <div class="grid3">
        <div class="mini"><h4>Array → egg box</h4><p>A fixed number of places, in order.</p></div>
        <div class="mini"><h4>List → shopping list</h4><p>Grows or shrinks as you add or cross off items.</p></div>
        <div class="mini"><h4>Tree → family tree</h4><p>Parents connected to children in levels.</p></div>
      </div>
      ${C(R`
        # Without a data structure
        mark1 = 72
        mark2 = 85
        mark3 = 64
        # With a data structure: one name, many values
        marks = [72, 85, 64]`, R`
        // Without a data structure
        int mark1 = 72;
        int mark2 = 85;
        int mark3 = 64;
        // With a data structure: one name, many values
        int[] marks = {72, 85, 64};`)}`},
    {h:'Static data structures', html:`
      ${ANALOGY('Analogy','A theatre with exactly 200 seats. The seats were built before the first show. You cannot add a seat during the show, and empty seats still take up space.')}
      <div class="prose"><ul>
        <li><b>Fixed size</b>, decided when the program is written or compiled.</li>
        <li>Memory is <b>allocated at compile time</b>, usually in one <b>contiguous</b> block (side by side).</li>
        <li>Because items sit side by side, the computer can jump straight to any item: <b>fast access</b>.</li>
        <li>If you reserve too much, memory is <b>wasted</b>. If you reserve too little, you run out.</li>
      </ul></div>
      <div class="scroll-x"><div class="cells">${[72,85,64,90,'',''].map((v,i)=>`<div class="cell"><span class="idx">addr ${1000+i*4}</span><div class="box ${v===''?'empty':'on'}">${v===''?'·':v}</div><span class="idx">[${i}]</span></div>`).join('')}</div></div>
      <p class="wnote">A static array of 6 integers in one block of memory. Two places are reserved but unused.</p>`},
    {h:'Dynamic data structures', html:`
      ${ANALOGY('Analogy','A queue of people at a bus stop. More people can join, people can leave, and the line is as long as it needs to be.')}
      <div class="prose"><ul>
        <li><b>Flexible size</b>: grows and shrinks <b>at runtime</b>.</li>
        <li>Memory is <b>allocated and freed as needed</b> while the program runs.</li>
        <li>Items may be spread around memory and linked together with <b>pointers</b> (as in a linked list), so reaching an item can take longer.</li>
        <li>Examples: Python lists, Java <code>ArrayList</code>, linked lists, trees, graphs.</li>
      </ul></div>
      <div class="row" style="font-family:var(--f-code);font-weight:700">
        <span class="tile">72</span><span>→</span><span class="tile">85</span><span>→</span><span class="tile">64</span><span>→</span><span class="tile" style="background:var(--hi);color:var(--hi-ink)">90 (new)</span><span>→ null</span>
      </div>
      <p class="wnote">A linked list: each item stores a value and a pointer to the next item. Adding one more just means making one more box and linking it.</p>
      ${W('staticdyn')}`},
    {h:'Side by side', html:`
      ${TABLE(['Feature','Static','Dynamic'],[
        ['Size','Fixed when compiled','Changes while running'],
        ['Memory allocated','At compile time','At runtime, when needed'],
        ['Resizing','Not possible (must make a new one and copy)','Possible'],
        ['Memory efficiency','Can waste memory if too big','Uses only what it needs (plus a little for pointers)'],
        ['Speed of access','Fast: items are contiguous','Can be slower: may need to follow pointers'],
        ['Flexibility','Low','High'],
        ['Example',P('<code>[0] * 6</code> used as a fixed array (Python has no true static array)','<code>int[] a = new int[6];</code>'),P('<code>list</code>','<code>ArrayList&lt;Integer&gt;</code>')]
      ])}
      ${C(R`
        # Python lists are dynamic
        basket = []
        basket.append("rice")      # grows to 1
        basket.append("milk")      # grows to 2
        basket.remove("rice")      # shrinks to 1
        # Simulating a fixed-size array
        seats = [None] * 6         # 6 places, we agree never to append`, R`
        // Static: fixed at 6
        int[] seats = new int[6];
        // seats has 6 places for ever. seats[6] would crash.

        // Dynamic: grows and shrinks
        ArrayList<String> basket = new ArrayList<>();
        basket.add("rice");        // size 1
        basket.add("milk");        // size 2
        basket.remove("rice");     // size 1`)}
      ${CALL('good','How to choose','Ask: <b>do I know the exact number of items in advance, and will it never change?</b> Days of the week, months, squares on a chessboard → static. Messages in a chat, items in a basket, players online → dynamic.')}`}
  ],
  mistakes:[
    ['“Static means the values cannot change”', 'Static means the <b>size</b> cannot change. You can still change the values inside an array.'],
    ['“Dynamic is always better”', 'Dynamic structures are flexible but can be slower to access and use extra memory for pointers.'],
    ['Mixing up compile time and runtime', 'Compile time is before the program runs. Runtime is while it runs.']
  ],
  hinge:[
    {q:'A weather station stores exactly 24 temperature readings per day, one per hour. Which is the best choice?', o:['A dynamic list, because temperatures change','A static array of size 24','A dynamic list, because it is always faster','A string'], a:1, why:'The number of readings is known and fixed (24), so a static array is ideal: no wasted space and fast access. The values changing does not matter.'},
    {q:'When is memory allocated for a dynamic data structure?', o:['At compile time','When the computer is switched on','At runtime, as it is needed','Never'], a:2, why:'Dynamic structures get memory while the program runs, whenever they need to grow.'}
  ],
  task1:{title:'Static or dynamic?', intro:'For each situation, write <b>static</b> or <b>dynamic</b> and give a reason that uses one of the key words.', qs:[
    {lv:1, q:'(a) The 12 months of the year. (b) The songs in a playlist that you keep adding to. (c) The 64 squares of a chessboard. (d) The items in an online shopping basket.', a:'(a) static: always 12. (b) dynamic: grows at runtime. (c) static: always 64. (d) dynamic: changes as the shopper adds and removes.'},
    {lv:1, q:'State two differences between static and dynamic data structures.', a:'Any two: fixed vs changing size; compile-time vs runtime memory allocation; cannot vs can resize; may waste memory vs uses what it needs; faster vs possibly slower access.'},
    {lv:2, q:'An app stores the names of students in a class in a static array of size 30. A new student joins and the class now has 31. Describe what the program must do.', a:'Create a new array that is bigger (e.g. size 31 or 40), copy all 30 names across, add the new name, then use the new array. This is slow and is why dynamic structures exist.'},
    {lv:3, q:'A dynamic list sounds better in every way. Give one situation where a static array is the better choice and explain why.', a:'Example: a game board or sensor data with a known, fixed size on a small device. A static array uses one contiguous block, gives fast access by index and has no pointer overhead.'}
  ]},
  task2:{title:'Design the storage for a school app', scenario:'<p>Your group is building the new <b>MySchool</b> app. It has five features:</p><ol><li>The weekly timetable: 5 days × 8 periods.</li><li>The live canteen order queue at lunchtime.</li><li>Photos a student uploads to their portfolio during the year.</li><li>The 7 school values shown on the home screen.</li><li>The class chat.</li></ol><p>The app will run on cheap phones with little memory.</p>',
    steps:[
      'For each feature decide: <b>static</b> or <b>dynamic</b>?',
      'For each choice write one reason about <b>size</b> and one about <b>memory</b> or <b>speed</b>.',
      'For the timetable, sketch the structure as a grid and say how many places it needs.',
      'For one dynamic feature, draw what happens in memory when a new item is added.',
      'Explainer: present your hardest decision in 30 seconds.'
    ],
    extension:'The head teacher wants a feature that stores every login for the whole year. Discuss whether a static array could work if you made it very large, and what the risks are.',
    answer:TABLE(['Feature','Choice','Reason'],[
      ['Timetable','Static (2D, 5 × 8 = 40 places)','Size is fixed and known; fast lookup by day and period.'],
      ['Canteen orders','Dynamic','Number of orders changes every minute.'],
      ['Portfolio photos','Dynamic','Unknown number; grows during the year.'],
      ['School values','Static (7)','Never changes; no wasted space.'],
      ['Class chat','Dynamic','Grows constantly at runtime.']
    ])+'<p>Extension: a huge static array wastes memory on a phone most of the time and can still run out; dynamic is safer.</p>'},
  home:[
    {q:'<span class="cmd">Define</span> the term <i>static data structure</i>.', m:1, ms:'A data structure whose size is fixed (set at compile time) and cannot change while the program runs.'},
    {q:'<span class="cmd">Compare</span> static and dynamic data structures in terms of memory allocation and resizing.', m:4, ms:'<ul><li>static: memory is allocated at compile time [1];</li><li>dynamic: memory is allocated (and freed) at runtime as required [1];</li><li>static cannot be resized while the program runs [1];</li><li>dynamic can grow and shrink as data is added or removed [1].</li></ul>'},
    {q:'A sensor records exactly 24 readings per day. <span class="cmd">Explain</span> one advantage of storing the readings in a static array.', m:2, ms:'<ul><li>the number of readings is known in advance so no memory is wasted / no resizing is needed [1];</li><li>elements are stored contiguously so any reading can be accessed directly and quickly by its index [1].</li></ul>'},
    {q:'<span class="cmd">Outline</span> why a dynamic data structure is suitable for storing a music playlist.', m:2, ms:'<ul><li>the number of songs is not known in advance / changes as songs are added or removed [1];</li><li>a dynamic structure can grow or shrink at runtime, so it only uses the memory it needs [1].</li></ul>'}
  ]
});

/* ---------- Lesson 6: Arrays and lists ---------- */
L({

    'Create a one-dimensional array or list and access items by index.',

    'Traverse (loop through) a list to total, average, count and find the largest value.',

  keywords:[
    ['Array','A fixed-size collection of items of the same type, accessed by index.'],
    ['List / ArrayList','A dynamic collection that can grow and shrink.'],
    ['Element','One item stored in an array or list.'],
    ['Index','The position of an element. The first is 0.'],

  teacher:[

    'Live-code the four basic operations in front of the class: create, read, change, loop. Ask students to predict each output first.',
    'For 2D arrays, use the seating-plan widget and a real classroom seating plan. Always say “row first, then column”.',

  learn:[

L({

  learn:[
    {h:'Last in, first out', html:`
      ${ANALOGY('Analogy','A tube of crisps. The last crisp put in is right at the top, so it is the first one you eat. You cannot reach the bottom crisp without taking the others out first.')}
      <div class="prose"><p>A <b>stack</b> is a list where you can only add and remove at one end, called the <b>top</b>. This rule is called <b>LIFO</b>: Last In, First Out.</p></div>`},
    {h:'The four operations', html:`
      ${TABLE(['Operation','What it does','Error to watch for'],[
        ['<code>push(item)</code>','Adds the item to the top. Size goes up by 1.','<b>Stack overflow</b> if a fixed-size stack is full.'],
        ['<code>pop()</code>','Removes the top item and returns it. Size goes down by 1.','<b>Stack underflow</b> if the stack is empty.'],
        ['<code>peek()</code>','Returns the top item but does <b>not</b> remove it.','Underflow if empty.'],
        ['<code>isEmpty()</code>','Returns True if there are no items, otherwise False.','None. Use it <b>before</b> pop or peek.']
      ])}

      <div class="prose"><p>Exam questions often give a list of operations. Draw the stack after each one, with the top at the right.</p></div>
      ${TABLE(['Operation','Stack (bottom → top)','Returned / output'],[
        ['push(5)','[5]',''],['push(9)','[5, 9]',''],['push(2)','[5, 9, 2]',''],['pop()','[5, 9]','2'],['peek()','[5, 9]','9'],['push(7)','[5, 9, 7]',''],['pop()','[5, 9]','7'],['isEmpty()','[5, 9]','False']
      ],[0,1,2])}`},
    {h:'Building a stack in code', html:`
      <div class="prose"><p>A stack is usually built on top of a list or array. ${P('In Python, the end of a list is the top: <code>append</code> pushes and <code>pop()</code> pops.','In Java, you can use an array with a <code>top</code> index (fixed size), or an <code>ArrayList</code> where the last element is the top (dynamic).')}</p></div>
      ${C(R`
        class Stack:
            def __init__(self):
                self.items = []              # top = end of the list

            def push(self, item):
                self.items.append(item)

            def pop(self):
                if self.is_empty():
                    print("Stack underflow")
                    return None
                return self.items.pop()

            def peek(self):
                if self.is_empty():
                    return None
                return self.items[-1]        # last item, not removed

            def is_empty(self):
                return len(self.items) == 0

        s = Stack()
        s.push(10)
        s.push(20)
        s.push(30)
        print(s.pop())     # 30
        print(s.peek())    # 20`, R`
        public class Stack {
            private int[] items = new int[5];   // fixed capacity
            private int top = -1;               // -1 means empty

            public void push(int item) {
                if (top == items.length - 1) {
                    System.out.println("Stack overflow");
                } else {
                    top++;
                    items[top] = item;
                }
            }
            public int pop() {
                if (isEmpty()) {
                    System.out.println("Stack underflow");
                    return -1;
                }
                int item = items[top];
                top--;
                return item;
            }
            public int peek() {
                if (isEmpty()) return -1;
                return items[top];
            }
            public boolean isEmpty() {
                return top == -1;
            }
        }`, 'A stack class')}
      ${CALL('good','Fast','push, pop, peek and isEmpty only touch the top, so each one takes the same time however big the stack is: <b>O(1)</b>. (You will meet Big O in B2.4.1.)')}
      ${TABLE(['Built on…','Good for','Watch out'],[['An array (fixed size)','A known maximum size; simple and memory-predictable','Overflow when full'],['A dynamic list / linked list','Unknown or changing size','Uses a bit more memory per item']])}`},
    {h:'Where stacks are used', html:`
      <div class="grid3">
        <div class="mini"><h4>Undo</h4><p>Each action is pushed. Undo pops the latest one.</p></div>
        <div class="mini"><h4>Back button</h4><p>Each page visited is pushed. Back pops.</p></div>
        <div class="mini"><h4>Function calls</h4><p>The computer pushes each call on the <b>call stack</b> and pops it when it returns.</p></div>
        <div class="mini"><h4>Reversing</h4><p>Push every letter, then pop them all: they come out backwards.</p></div>
        <div class="mini"><h4>Checking brackets</h4><p>Push each <code>(</code>, pop on each <code>)</code>. Code editors do this.</p></div>
      </div>
      ${C(R`
        def reverse(word):
            stack = []
            for letter in word:
                stack.append(letter)        # push each letter
            result = ""
            while len(stack) > 0:
                result = result + stack.pop()   # pop: last letter first
            return result

        print(reverse("DUBAI"))     # IABUD`, R`
        static String reverse(String word) {
            ArrayList<Character> stack = new ArrayList<>();
            for (char letter : word.toCharArray()) {
                stack.add(letter);                          // push
            }
            String result = "";
            while (!stack.isEmpty()) {
                result += stack.remove(stack.size() - 1);  // pop
            }
            return result;
        }
        // reverse("DUBAI") returns "IABUD"`, 'Reversing a word with a stack')}`}

    {h:'First in, first out', html:`

      <div class="prose"><p>A <b>queue</b> is a list where items join at one end (the <b>rear</b> or tail) and leave from the other end (the <b>front</b> or head). This rule is <b>FIFO</b>: First In, First Out.</p></div>

    {h:'See it in action, including the circular trick', html:`
      <div class="prose"><p>If you store a queue in an array and shuffle everyone forward after each dequeue, that is slow for big queues. Instead we keep two pointers, <b>front</b> and <b>rear</b>, and move <i>them</i>. When the rear reaches the end of the array, it <b>wraps round</b> to index 0 if there is space. This is a <b>circular queue</b>.</p></div>
      ${W('queue')}
      ${CALL('','The wrap-around formula','<code>rear = (rear + 1) % capacity</code>. With capacity 5: from rear 4, (4 + 1) % 5 = 0. The <code>%</code> (modulo) gives the remainder, so the index cycles 0, 1, 2, 3, 4, 0, 1…')}`},
    {h:'A circular queue in code', html:`
      ${C(R`
        CAPACITY = 5
        queue = [None] * CAPACITY
        front = 0        # index of the item to leave next
        rear = -1        # index of the last item that joined
        size = 0

        def is_empty():
            return size == 0

        def is_full():
            return size == CAPACITY

        def enqueue(item):
            global rear, size
            if is_full():
                print("Queue overflow")
                return
            rear = (rear + 1) % CAPACITY
            queue[rear] = item
            size = size + 1

        def dequeue():
            global front, size
            if is_empty():
                print("Queue underflow")
                return None
            item = queue[front]
            queue[front] = None
            front = (front + 1) % CAPACITY
            size = size - 1
            return item`, R`
        public class CircularQueue {
            private String[] queue = new String[5];
            private int front = 0;    // index of the item to leave next
            private int rear = -1;    // index of the last item that joined
            private int size = 0;

            public boolean isEmpty() { return size == 0; }
            public boolean isFull()  { return size == queue.length; }

            public void enqueue(String item) {
                if (isFull()) {
                    System.out.println("Queue overflow");
                    return;
                }
                rear = (rear + 1) % queue.length;
                queue[rear] = item;
                size++;
            }
            public String dequeue() {
                if (isEmpty()) {
                    System.out.println("Queue underflow");
                    return null;
                }
                String item = queue[front];
                queue[front] = null;
                front = (front + 1) % queue.length;
                size--;
                return item;
            }
        }`, 'Exam-style circular queue')}

L({
  id:'loops', unit:'B2.3', code:'B2.3.3', title:'Loops: repeating actions',
  tagline:'A loop repeats code. A for loop repeats a set number of times; a while loop repeats while a condition stays true.',
  objectives:[
    'Use a count-controlled for loop and predict how many times it runs.',
    'Use a condition-controlled while loop and avoid infinite loops.',
    'Put selection inside a loop, and use break and continue.',
    'Use nested loops and work out how many times the inner code runs.'
  ],
  keywords:[
    ['Iteration','Repeating code. One pass through a loop is also called an iteration.'],
    ['Count-controlled loop','Repeats a known number of times: a for loop.'],
    ['Condition-controlled loop','Repeats while a condition is true: a while loop.'],
    ['Loop variable','The variable that changes on each pass, e.g. <code>i</code>.'],
    ['break / continue','break leaves the loop now. continue skips to the next pass.'],
    ['Nested loop','A loop inside another loop.']
  ],
  doNow:[
    {q:P('What is printed when <code>x = 12</code>?<br><code>if x &gt; 10 and x &lt; 20:</code> print("teen") else print("no")','What is printed when <code>x = 12</code>?<br><code>if (x &gt; 10 &amp;&amp; x &lt; 20)</code> print "teen" else print "no"'), a:'teen.'},
    {q:'How would you tell a robot to clap 100 times without writing “clap” 100 times?', a:'“Repeat 100 times: clap.” That is a loop.'},
    {q:'You keep asking a friend for their password until they get it right. Do you know in advance how many times you will ask?', a:'No. You repeat while it is wrong. That is a condition-controlled (while) loop.'},
