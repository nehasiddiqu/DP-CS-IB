  ],
  teacher:[
    'Ask: “Which loop would you use?” for everyday examples (brush each tooth = for; stir until smooth = while). Students should justify with “known number of times” vs “until something happens”.',
    'Spend time on the range rule with the widget: the stop value is never reached. Have students predict the tiles before pressing Run.',
    'Model a trace table for a while loop before students do one alone.',
    'Java teachers: show do-while (runs at least once). Python has no do-while; show the <code>while True</code> + <code>break</code> pattern instead.'
  ],
  learn:[
    {h:'Why loops?', html:`
      ${ANALOGY('Analogy','A PE teacher says “Run 5 laps” (you know how many: a <b>for</b> loop) or “Keep running until the whistle” (you do not know how many: a <b>while</b> loop).')}
      ${C(R`
        # without a loop
        print("Practice!")
        print("Practice!")
        print("Practice!")
        # with a loop
        for i in range(3):
            print("Practice!")`, R`
        // without a loop
        System.out.println("Practice!");
        System.out.println("Practice!");
        System.out.println("Practice!");
        // with a loop
        for (int i = 0; i < 3; i++) {
            System.out.println("Practice!");
        }`)}`},
    {h:'The for loop: a set number of times', html:`
      <div class="prose"><p>${P('<code>range(start, stop, step)</code> makes the numbers from start up to, <b>but not including</b>, stop. If you give only one number, start is 0 and step is 1: <code>range(5)</code> gives 0, 1, 2, 3, 4.','The for loop has three parts: <code>for (start; condition; update)</code>. <code>for (int i = 0; i &lt; 5; i++)</code> gives 0, 1, 2, 3, 4. <code>i++</code> means add 1.')}</p></div>
      ${W('loops')}
      ${C(R`
        fruits = ["apple", "mango", "date"]
        for fruit in fruits:          # loop over a list
            print(fruit)

        for letter in "UAE":          # loop over a string
            print(letter)             # U, A, E`, R`
        String[] fruits = {"apple", "mango", "date"};
        for (String fruit : fruits) {          // loop over an array
            System.out.println(fruit);
        }

        for (char letter : "UAE".toCharArray()) {
            System.out.println(letter);        // U, A, E
        }`, 'Looping over a collection')}`},
    {h:'The while loop: until something changes', html:`
      <div class="prose"><p>A <b>while</b> loop checks its condition <b>before</b> each pass. If it is true, the body runs; then it checks again. Something inside the loop must eventually make the condition false, or it never ends.</p></div>
      ${W('trace','doubling')}
      <div class="only-java">${CALL('','do-while: runs at least once','The condition is checked at the <b>end</b>, so the body always runs once. Good for menus and input checks.')}${C(null, R`

            guess = sc.nextInt();
        } while (guess != 7);
        System.out.println("Correct!");`)}</div>
      <div class="only-py">${CALL('','Python has no do-while','Use <code>while True:</code> with a <code>break</code> when you want the body to run at least once.')}${C(R`
        while True:
            guess = int(input("Guess a number from 1 to 10: "))
            if guess == 7:
                break
        print("Correct!")`, null)}</div>
      ${TABLE(['','for loop','while loop'],[['Use when','You know how many times, or you are going through a list','You repeat until something happens'],['Example','Print the 7 times table','Keep asking until the password is right'],['Risk','Off-by-one at the stop value','Infinite loop if the condition never becomes false']])}`},
    {h:'Decisions inside loops, break and continue', html:`
      ${C(R`
        for i in range(1, 11):
            if i % 2 == 0:
                print(i, "is even")
            else:
                print(i, "is odd")

        numbers = [10, 25, 42, 58, 71]
        for n in numbers:
            if n == 42:
                print("Found 42!")
                break              # stop the whole loop now

        for i in range(1, 11):
            if i % 3 == 0:
                continue           # skip the rest of this pass
            print(i)               # 1 2 4 5 7 8 10`, R`

        public class Report {
            static int[] getMarks() {
                return new int[]{72, 85, 64, 90};
            }
            static double average(int[] marks) {
                int total = 0;
                for (int m : marks) total += m;
                return (double) total / marks.length;
            }
            static String grade(double avg) {
                if (avg >= 80) return "A";
                else if (avg >= 65) return "B";
                return "C";

            public static void main(String[] args) {
                int[] marks = getMarks();

      <div class="prose"><ol><li>Set <b>low</b> to the first index and <b>high</b> to the last.</li><li>While low ≤ high: work out <b>mid</b> = (low + high) ÷ 2, rounded down.</li><li>If the item at mid is the target, return mid.</li><li>If the item at mid is <b>smaller</b> than the target, the target must be on the right: low = mid + 1.</li><li>Otherwise it must be on the left: high = mid − 1.</li><li>If low passes high, the target is not there: return −1.</li></ol></div>
      ${C(R`
        def binary_search(items, target):      # items MUST be sorted
            low = 0
            high = len(items) - 1
            while low <= high:
                mid = (low + high) // 2        # // = whole-number division
                if items[mid] == target:
                    return mid
                elif items[mid] < target:

                else:

            while (low <= high) {
                int mid = (low + high) / 2;    // int division rounds down
                if (items[mid] == target) {
                    return mid;
                } else if (items[mid] < target) {
                    low = mid + 1;             // look in the right half
                } else {
                    high = mid - 1;            // look in the left half
                }
            }
            return -1;
        }`)}
