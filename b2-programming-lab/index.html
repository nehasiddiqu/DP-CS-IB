<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="description" content="Visual IB Computer Science B2 Programming lessons in Python and Java"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>B2 Programming Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Visual lessons for IB DP Computer Science B2 Programming in Python and Java">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: clean white exercise book. Sticky top bar, lesson index on the left, lesson flows as phases (Do Now → Learn → Task 1 → Task 2 → Home learning). */
/* Single light theme by request: white page, green borders and accents. */
:root{
  --paper:#FFFFFF; --surface:#FFFFFF; --ink:#14261C; --muted:#4D6457; --line:#BFE3CC; --grid:transparent;
  --accent:#15803D; --accent-ink:#FFFFFF; --accent-soft:#E9F7EE; --border:#22A55A;
  --hi:#FFE36E; --hi-ink:#4A3B00;
  --good:#15803D; --good-soft:#DCF5E5; --bad:#C0352B; --bad-soft:#FDE6E3; --warn:#9A6206; --warn-soft:#FDF1D8;
  --py:#1D4ED8; --java:#C2410C;
  --code-bg:#F7FCF8; --code-ink:#1C2B22; --code-line:#BFE3CC;
  --t-kw:#7E22CE; --t-str:#B45309; --t-com:#6B7C72; --t-num:#1D4ED8; --t-fn:#0F766E;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius:10px; --side:270px; --fs:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:120px}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{animation:none!important; transition:none!important} }
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:var(--fs); line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:var(--surface)}
body.big{--fs:19px}
h1,h2,h3,h4{font-family:var(--f-display); line-height:1.2; text-wrap:balance; margin:0}
h1{font-size:clamp(1.8rem, 3.6vw, 2.6rem); font-weight:800; letter-spacing:-.02em}
h2{font-size:1.5rem; font-weight:750; letter-spacing:-.01em}
h3{font-size:1.15rem; font-weight:700}
h4{font-size:1rem; font-weight:700}
p{margin:0}
a{color:var(--accent)}
code{font-family:var(--f-code); font-size:.9em; background:var(--accent-soft); padding:.08em .35em; border-radius:5px; color:var(--ink)}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}
.lang-java .only-py, .lang-py .only-java{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:var(--surface); border-bottom:1px solid var(--line);
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:10px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); margin-right:auto; min-width:0}
.brand-mark{width:34px; height:34px; border-radius:8px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-family:var(--f-code); font-weight:700; font-size:.85rem; flex:none}
.brand b{font-family:var(--f-display); font-size:1.08rem; font-weight:800; letter-spacing:-.01em; display:block; line-height:1.1}
.brand small{color:var(--muted); font-size:.78rem; display:block}
.controls{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--paper)}
.seg button{border:0; background:transparent; padding:5px 12px; border-radius:999px; cursor:pointer; font-size:.86rem; font-weight:700; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.chip-btn{border:1px solid var(--line); background:var(--paper); padding:6px 12px; border-radius:999px; cursor:pointer; font-size:.86rem; font-weight:700; color:var(--ink)}
.chip-btn[aria-pressed="true"]{background:var(--hi); color:var(--hi-ink); border-color:transparent}
.menu-btn{display:none}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:var(--side) minmax(0,1fr); min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line); background:var(--surface); padding:18px 12px 40px; position:sticky; top:calc(57px + env(safe-area-inset-top,0px)); height:calc(100vh - 57px); overflow:auto}
.side h4{font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); padding:14px 10px 6px}
.side a{display:flex; gap:8px; align-items:baseline; padding:7px 10px; border-radius:8px; text-decoration:none; color:var(--ink); font-size:.92rem; line-height:1.3}
.side a:hover{background:var(--accent-soft)}
.side a[aria-current="page"]{background:var(--accent); color:var(--accent-ink)}
.side a .num{font-family:var(--f-code); font-size:.74rem; opacity:.75; flex:none; width:44px}
.hl-badge{font-family:var(--f-code); font-size:.66rem; font-weight:700; border:1px solid currentColor; border-radius:4px; padding:0 4px; margin-left:auto; flex:none; opacity:.85}
main{min-width:0; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:28px 80px}
.wrap{max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:28px}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed; inset:0 auto 0 0; width:min(320px, 86vw); height:100%; z-index:70; transform:translateX(-102%); transition:transform .2s; box-shadow:0 0 40px rgba(0,0,0,.25); padding-top:calc(18px + env(safe-area-inset-top,0px)); padding-left:max(12px, env(safe-area-inset-left,0px))}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:65}
}

/* ---------- lesson header + phase bar ---------- */
.lesson-head{display:flex; flex-direction:column; gap:12px}
.eyebrow{font-family:var(--f-code); font-size:.8rem; letter-spacing:.04em; color:var(--accent); font-weight:700; display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.eyebrow .pill{background:var(--hi); color:var(--hi-ink); padding:1px 8px; border-radius:999px}
.lead{font-size:1.12rem; color:var(--muted); max-width:68ch}
.phasebar{margin-top:-14px; position:sticky; top:calc(57px + env(safe-area-inset-top,0px)); z-index:30; background:var(--paper); padding-block:8px; display:flex; gap:6px; overflow-x:auto; border-bottom:1px solid var(--line); margin-inline:-4px; padding-inline:4px; scrollbar-width:thin}
.phasebar a{flex:none; text-decoration:none; font-size:.84rem; font-weight:700; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); white-space:nowrap}
.phasebar a span{font-family:var(--f-code); color:var(--muted); font-weight:400; margin-left:6px; font-size:.76rem}
.phasebar a:hover{border-color:var(--accent)}

/* ---------- sections ---------- */
.phase{display:flex; flex-direction:column; gap:18px; scroll-margin-top:120px}
.phase-title{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-bottom:8px; border-bottom:2px solid var(--border)}
.phase-title .tag{font-family:var(--f-code); font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; padding:3px 9px; border-radius:6px; background:var(--accent); color:var(--accent-ink)}
.phase-title .mins{margin-left:auto; font-family:var(--f-code); color:var(--muted); font-size:.85rem}
.panel{background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:20px; display:flex; flex-direction:column; gap:14px; min-width:0}
.panel > h3{display:flex; gap:10px; align-items:baseline}
.step-no{font-family:var(--f-code); font-size:.8rem; color:var(--accent); font-weight:700}
.prose{display:flex; flex-direction:column; gap:12px; max-width:72ch}
.prose ul,.prose ol{margin:0; padding-left:1.3em; display:flex; flex-direction:column; gap:6px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:14px}
.grid3{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:14px}
.mini{border:1px solid var(--line); border-radius:8px; padding:14px; background:var(--paper); display:flex; flex-direction:column; gap:8px; min-width:0}
.mini h4{font-size:.98rem}
.analogy{display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; align-items:start; background:var(--hi); color:var(--hi-ink); border-radius:var(--radius); padding:16px 18px}
.analogy .ic{font-family:var(--f-display); font-weight:800; font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; border:2px solid currentColor; border-radius:6px; padding:2px 7px; white-space:nowrap}
.callout{border-left:4px solid var(--accent); background:var(--accent-soft); padding:12px 16px; border-radius:0 8px 8px 0}
.callout.warn{border-color:var(--warn); background:var(--warn-soft)}
.callout.bad{border-color:var(--bad); background:var(--bad-soft)}
.callout.good{border-color:var(--good); background:var(--good-soft)}
.callout b:first-child{display:block; margin-bottom:2px}
.kw-list{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:10px}
.kw{border:1px dashed var(--line); border-radius:8px; padding:10px 12px; background:var(--surface)}
.kw dt{font-weight:700; font-family:var(--f-display)}
.kw dd{margin:2px 0 0; color:var(--muted); font-size:.93rem}
.objectives{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px}
.objectives li{display:flex; gap:10px}
.objectives li::before{content:"✓"; color:var(--good); font-weight:700}
table.t{border-collapse:collapse; width:100%; font-size:.94rem}
table.t th, table.t td{border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top}
table.t th{background:var(--accent-soft); font-family:var(--f-display)}
table.t td.mono, table.t th.mono{font-family:var(--f-code); font-size:.88rem; font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}

/* ---------- code ---------- */
.code{border-radius:var(--radius); overflow:hidden; background:var(--code-bg); color:var(--code-ink); min-width:0; border:2px solid var(--border)}
.code-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 10px 6px 14px; border-bottom:1px solid var(--code-line); font-size:.78rem; font-family:var(--f-code)}
.code-head .lt{font-weight:700; letter-spacing:.04em}
.code-head .lt.py{color:var(--py)} .code-head .lt.java{color:var(--java)}
.code-head .cap{color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.code-head button{background:var(--surface); border:1px solid var(--code-line); color:var(--ink); border-radius:6px; padding:2px 8px; cursor:pointer; font-size:.74rem}
.code pre{margin:0; padding:14px 16px; overflow-x:auto; font-family:var(--f-code); font-size:.88rem; line-height:1.6; tab-size:4}
.code .ln{display:block; padding-inline:6px; margin-inline:-6px; border-radius:4px}
.code .ln.active{background:#FFF4C2; box-shadow:inset 3px 0 0 #E0A800}
.t-kw{color:var(--t-kw); font-weight:600} .t-str{color:var(--t-str)} .t-com{color:var(--t-com); font-style:italic} .t-num{color:var(--t-num)} .t-fn{color:var(--t-fn)}
.out{background:var(--code-bg); color:#14532D; font-family:var(--f-code); font-size:.86rem; border-radius:8px; padding:10px 14px; white-space:pre-wrap; min-height:2.6em; border:1px solid var(--code-line)}
.out .err{color:var(--bad); font-weight:700} .out .dim{color:var(--muted)}

/* ---------- interactive bits ---------- */
details.reveal{border:1px solid var(--line); border-radius:8px; background:var(--paper)}
details.reveal > summary{cursor:pointer; padding:8px 12px; font-weight:700; font-size:.9rem; color:var(--accent); list-style:none}
details.reveal > summary::-webkit-details-marker{display:none}
details.reveal > summary::before{content:"▸ "}
details.reveal[open] > summary::before{content:"▾ "}
details.reveal > div{padding:4px 14px 14px; display:flex; flex-direction:column; gap:8px}
.donow{counter-reset:dn; display:grid; grid-template-columns:repeat(auto-fit, minmax(270px,1fr)); gap:12px}
.dn{counter-increment:dn; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0}
.dn > p:first-child::before{content:counter(dn); display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:.85rem; margin-right:8px; font-family:var(--f-code)}
.btn{border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); padding:7px 14px; border-radius:8px; cursor:pointer; font-weight:700; font-size:.9rem}
.btn.ghost{background:transparent; color:var(--accent)}
.btn.small{padding:4px 10px; font-size:.82rem}
.btn:disabled{opacity:.45; cursor:not-allowed}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
input[type=text], input[type=number], select{font:inherit; font-size:.92rem; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); min-width:0}
input[type=number]{width:5.5em}
label.lbl{font-size:.85rem; color:var(--muted); font-weight:700; display:flex; gap:6px; align-items:center}
.mcq{display:flex; flex-direction:column; gap:10px}
.mcq .opts{display:grid; gap:8px}
.mcq .opts button{text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:9px 12px; cursor:pointer; display:flex; gap:10px}
.mcq .opts button b{font-family:var(--f-code)}
.mcq .opts button:hover{border-color:var(--accent)}
.mcq .opts button.right{background:var(--good-soft); border-color:var(--good)}
.mcq .opts button.wrong{background:var(--bad-soft); border-color:var(--bad)}
.mcq .why{font-size:.94rem}
.timer{display:flex; align-items:center; gap:12px; flex-wrap:wrap; border:2px solid var(--border); border-radius:var(--radius); padding:10px 14px; background:var(--surface)}
.timer .clock{font-family:var(--f-code); font-size:1.9rem; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.02em; min-width:4.2ch}
.timer .tlabel{font-weight:700; font-size:.9rem; color:var(--muted)}
.timer.done{border-color:var(--bad); animation:pulse 1s 4}
.timer.done .clock{color:var(--bad)}
@keyframes pulse{50%{background:var(--bad-soft)}}
.task{display:flex; flex-direction:column; gap:12px}
.task ol.qs{margin:0; padding-left:1.4em; display:flex; flex-direction:column; gap:14px}
.task ol.qs > li::marker{font-weight:700; color:var(--accent)}
.level{display:inline-block; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; padding:1px 7px; border-radius:4px; margin-right:6px; vertical-align:2px}
.level.l1{background:var(--good-soft); color:var(--good)} .level.l2{background:var(--warn-soft); color:var(--warn)} .level.l3{background:var(--bad-soft); color:var(--bad)}
.roles{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:10px}
.role{border:1px solid var(--line); border-radius:8px; padding:12px; background:var(--paper)}
.role b{font-family:var(--f-display); display:block}
.scenario{border:2px dashed var(--accent); border-radius:var(--radius); padding:16px 18px; background:var(--accent-soft); display:flex; flex-direction:column; gap:8px}
.scenario .stag{font-family:var(--f-code); font-size:.75rem; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.08em}
.exam{display:flex; flex-direction:column; gap:14px}
.eq{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; display:flex; flex-direction:column; gap:10px}
.eq-head{display:flex; gap:10px; align-items:baseline}
.eq-head > div{min-width:0; flex:1}
.eq-head .qn{font-family:var(--f-code); font-weight:700; color:var(--accent)}
.eq-head .marks{margin-left:auto; font-family:var(--f-code); font-weight:700; white-space:nowrap}
.cmd{font-weight:700; background:var(--hi); color:var(--hi-ink); padding:0 4px; border-radius:3px}
.ms ul{margin:0; padding-left:1.2em}
.teacher{display:none; border:2px solid var(--warn); background:var(--warn-soft); border-radius:var(--radius); padding:14px 18px; flex-direction:column; gap:8px}
.teacher > b:first-child{font-family:var(--f-code); font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--warn)}
.teacher ul{margin:0; padding-left:1.2em; display:flex; flex-direction:column; gap:4px}
body.tmode .teacher{display:flex}
.pager{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:18px}
.pager a{text-decoration:none; border:1px solid var(--line); background:var(--surface); padding:10px 14px; border-radius:var(--radius); color:var(--ink); max-width:48%; min-width:0}
.pager a small{display:block; color:var(--muted); font-family:var(--f-code); font-size:.75rem}
.pager a.next{margin-left:auto; text-align:right}

/* ---------- widgets ---------- */
.widget{background:var(--surface); border:2px solid var(--accent); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0}
.widget > .wtitle{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.widget > .wtitle b{font-family:var(--f-display); font-size:1.02rem}
.widget > .wtitle .try{font-family:var(--f-code); font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; background:var(--accent); color:var(--accent-ink); padding:2px 8px; border-radius:4px}
.wnote{font-size:.9rem; color:var(--muted)}
.msg{font-weight:700; padding:8px 12px; border-radius:8px; background:var(--paper); border:1px solid var(--line); font-size:.93rem}
.msg.good{background:var(--good-soft); color:var(--good); border-color:transparent}
.msg.bad{background:var(--bad-soft); color:var(--bad); border-color:transparent}
.msg.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.scroll-x{overflow-x:auto; padding-bottom:4px}
.cells{display:flex; gap:4px; width:max-content}
.cell{display:flex; flex-direction:column; align-items:center; gap:2px}
.cell .box{width:46px; height:46px; display:grid; place-items:center; border:2px solid var(--ink); border-radius:6px; background:var(--surface); font-family:var(--f-code); font-weight:700; transition:background .2s, transform .2s, opacity .2s}
.cell .idx{font-family:var(--f-code); font-size:.74rem; color:var(--muted)}
.cell .box.on{background:var(--hi); color:var(--hi-ink)}
.cell .box.cur{background:#1D4ED8; color:#fff; border-color:#1D4ED8; transform:translateY(-4px)}
.cell .box.off{opacity:.25}
.cell .box.found{background:var(--good); color:var(--paper); border-color:var(--good)}
.cell .box.empty{border-style:dashed; color:var(--muted); font-weight:400}
.cell .ptr{font-family:var(--f-code); font-size:.7rem; font-weight:700; color:var(--accent); min-height:1.1em}
.membox{display:flex; flex-wrap:wrap; gap:12px}
.vbox{border:2px solid var(--ink); border-radius:8px; min-width:120px; background:var(--surface); overflow:hidden; animation:pop .25s}
.vbox .vn{background:var(--ink); color:var(--paper); font-family:var(--f-code); font-size:.8rem; padding:3px 8px; display:flex; justify-content:space-between; gap:8px}
.vbox .vv{font-family:var(--f-code); font-weight:700; padding:10px; font-size:1.05rem; text-align:center; word-break:break-all}
.vbox .vv s{color:var(--muted); font-weight:400; font-size:.85rem; margin-right:6px}
@keyframes pop{from{transform:scale(.85); opacity:0}}
.typetag{font-size:.68rem; background:var(--hi); color:var(--hi-ink); padding:0 5px; border-radius:3px}
.stackviz{display:flex; flex-direction:column-reverse; gap:4px; width:180px; min-height:260px; border:3px solid var(--ink); border-top:0; border-radius:0 0 10px 10px; padding:6px; justify-content:flex-start}
.stackviz .it{background:var(--accent); color:var(--accent-ink); border-radius:6px; padding:8px; text-align:center; font-family:var(--f-code); font-weight:700; animation:drop .25s}
.stackviz .it.top{background:var(--hi); color:var(--hi-ink); outline:2px solid var(--ink)}
@keyframes drop{from{transform:translateY(-30px); opacity:0}}
.flow{display:flex; flex-direction:column; gap:8px; align-items:flex-start}
.fnode{border:2px solid var(--line); border-radius:8px; padding:8px 12px; background:var(--paper); font-family:var(--f-code); font-size:.88rem; transition:all .2s}
.fnode.dec{border-style:solid; border-radius:20px}
.fnode.lit{border-color:var(--accent); background:var(--accent-soft); font-weight:700}
.fnode.yes{border-color:var(--good); background:var(--good-soft); color:var(--good); font-weight:700}
.fnode.no{border-color:var(--line); opacity:.6}
.fnode.err{border-color:var(--bad); background:var(--bad-soft); color:var(--bad); font-weight:700}
.arrow{font-family:var(--f-code); color:var(--muted); padding-left:18px; font-size:.8rem}
.tiles{display:flex; flex-wrap:wrap; gap:6px}

.gridviz{display:grid; gap:4px; width:max-content}
.gridviz .g{width:52px; height:40px; display:grid; place-items:center; border:1px solid var(--line); border-radius:6px; font-family:var(--f-code); font-size:.82rem; background:var(--paper); cursor:pointer; transition:background .15s}
.gridviz .g.hd{background:transparent; border:0; color:var(--muted); cursor:default; font-size:.72rem}
.gridviz .g.on{background:var(--hi); color:var(--hi-ink)}
.gridviz .g.cur{background:#1D4ED8; color:#fff}
.gridviz .g.rowon{background:var(--accent-soft)}
.bars{display:flex; align-items:flex-end; gap:6px; height:200px; padding:8px; border-bottom:2px solid var(--ink)}
.bar{flex:1; min-width:22px; max-width:56px; background:#5B8DEF; border-radius:5px 5px 0 0; display:flex; align-items:flex-start; justify-content:center; color:var(--accent-ink); font-family:var(--f-code); font-weight:700; font-size:.8rem; padding-top:4px; transition:height .25s, background .2s}
.bar.cmp{background:var(--hi); color:var(--hi-ink)}
.bar.swap{background:var(--bad); color:var(--paper)}
.bar.done{background:var(--good); color:#fff}
.bar.min{background:var(--warn); color:var(--paper)}
.counters{display:flex; gap:16px; flex-wrap:wrap; font-family:var(--f-code); font-size:.86rem}
.counters b{font-size:1.1rem}
.frames{display:flex; flex-direction:column-reverse; gap:6px; min-height:120px}
.frame{border:2px solid var(--ink); border-radius:8px; padding:8px 12px; font-family:var(--f-code); font-size:.88rem; background:var(--surface); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; animation:drop .25s}
.frame.top{background:var(--hi); color:var(--hi-ink)}
.frame.base{border-color:var(--good)}
.frame .ret{font-weight:700; color:var(--good)}
.frame.overflow{border-color:var(--bad); background:var(--bad-soft); color:var(--bad)}
.parsons{display:flex; flex-direction:column; gap:6px}
.pline{display:flex; gap:8px; align-items:center; background:var(--code-bg); color:var(--code-ink); border-radius:6px; padding:4px 6px 4px 12px; font-family:var(--f-code); font-size:.86rem; border:2px solid transparent; min-width:0}
.pline pre{margin:0; flex:1; white-space:pre; overflow-x:auto; font:inherit}
.pline.ok{border-color:var(--good)} .pline.no{border-color:var(--bad)}
.pline button{background:var(--accent-soft); color:var(--accent); font-weight:700; border:0; border-radius:4px; width:28px; height:26px; cursor:pointer}
.filebox{border:2px solid var(--ink); border-radius:8px; overflow:hidden; min-width:0}
.filebox .fh{background:var(--ink); color:var(--paper); font-family:var(--f-code); font-size:.8rem; padding:4px 10px; display:flex; justify-content:space-between}
.filebox pre{margin:0; padding:10px; font-family:var(--f-code); font-size:.86rem; min-height:90px; white-space:pre-wrap; background:var(--surface); counter-reset:fl}
.svgchart text{fill:var(--muted); font-family:var(--f-code); font-size:11px}
.svgchart .ax{stroke:var(--ink); stroke-width:1.5}
.svgchart .gl{stroke:var(--line); stroke-width:1}
.scope-map{display:flex; flex-direction:column; gap:10px; border:2px solid var(--ink); border-radius:10px; padding:12px; transition:background .2s}
.scope-map .room{border:2px dashed var(--muted); border-radius:8px; padding:10px; transition:background .2s}
.scope-map .lit{background:var(--good-soft); border-color:var(--good)}
.scope-map .dark{background:var(--bad-soft)}
.var-chip{display:inline-block; font-family:var(--f-code); font-weight:700; background:var(--hi); color:var(--hi-ink); padding:1px 8px; border-radius:5px; margin:2px}

</style>

<script>
/* ================= core helpers ================= */
const LESSONS = [];
const UNITS = {
  "B2.1": "Programming fundamentals",
  "B2.2": "Data structures",
  "B2.3": "Programming constructs",
  "B2.4": "Programming algorithms",
  "B2.5": "File processing"
};
function L(o){ LESSONS.push(o); }
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function dedent(s){
  s = s.replace(/^\n/, '').replace(/\s+$/, '');
  const lines = s.split('\n');
  const ind = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
  return lines.map(l => l.slice(ind)).join('\n');
}
const KW = {
  py: new Set('def return if elif else for while in range and or not True False None try except finally with as import from class global pass is break continue raise self'.split(' ')),
  java: new Set('public private protected static void int double float char boolean String class return if else for while do new try catch finally import true false null break continue this long short byte final throws throw extends'.split(' '))
};
function hl(src, lang){
  const re = lang === 'py'
    ? /(#.*$)|(f?"(?:[^"\\\n]|\\.)*"|f?'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([\s\S])/gm
    : /(\/\/.*$|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([\s\S])/gm;
  let out = '', m;
  while ((m = re.exec(src))){
    if (m[1]) out += `<span class="t-com">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="t-str">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="t-num">${m[3]}</span>`;
    else if (m[4]){
      const w = m[4];
      if (KW[lang].has(w)) out += `<span class="t-kw">${w}</span>`;
      else if (src[re.lastIndex] === '(') out += `<span class="t-fn">${w}</span>`;
      else out += w;
    } else out += esc(m[5]);
  }
  return out;
}
function hlLines(src, lang){
  return hl(src, lang).split('\n').map((l,i) => `<span class="ln" data-ln="${i}">${l || ' '}</span>`).join('');
}
function codeBlock(src, lang, cap){
  const name = lang === 'py' ? 'PYTHON' : 'JAVA';
  const canExplain = !/Traceback|error:/.test(src);
  return `<div class="code"><div class="code-head"><span class="lt ${lang}">${name}</span>${cap?`<span class="cap">${esc(cap)}</span>`:''}<span class="code-tools">${canExplain?'<button type="button" class="xbtn" data-explain aria-pressed="false">Explain each line</button>':''}<button type="button" data-copy>Copy</button></span></div><pre data-lang="${lang}" data-src="${esc(src).replace(/"/g, '&quot;')}">${hlLines(src, lang)}</pre></div>`;
}
/* C(python, java, caption) — shows the version for the chosen language */
function C(py, java, cap){
  let h = '';
  if (py != null) h += `<div class="only-py">${codeBlock(dedent(py), 'py', cap)}</div>`;
  if (java != null) h += `<div class="only-java">${codeBlock(dedent(java), 'java', cap)}</div>`;
  return h;
}
/* P(python text, java text) — inline language-specific text */
const P = (py, java) => `<span class="only-py">${py}</span><span class="only-java">${java}</span>`;
const W = (name, opts='') => `<div class="widget" data-w="${name}" data-opts="${esc(opts)}"></div>`;
const ANALOGY = (title, html) => `<div class="analogy"><span class="ic">${title}</span><div>${html}</div></div>`;
const CALL = (kind, title, html) => `<div class="callout ${kind}"><b>${title}</b>${html}</div>`;
const REVEAL = (label, html) => `<details class="reveal ans"><summary>${label}</summary><div>${html}</div></details>`;
const TABLE = (head, rows, mono=[]) => `<div class="tbl"><table class="t"><thead><tr>${head.map((h,i)=>`<th class="${mono.includes(i)?'mono':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${mono.includes(i)?'mono':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
let MCQ_ID = 0;
function MCQ(q, opts, ans, why){
  const id = 'm' + (MCQ_ID++);
  return `<div class="mcq" data-ans="${ans}" id="${id}"><div>${q}</div><div class="opts">${opts.map((o,i)=>`<button type="button" data-i="${i}"><b>${'ABCD'[i]}</b><span>${o}</span></button>`).join('')}</div><div class="why" hidden>${why}</div></div>`;
}
const TIMER = (min, label) => `<div class="timer" data-min="${min}"><span class="clock">${String(min).padStart(2,'0')}:00</span><span class="tlabel">${label}</span><div class="row" style="margin-left:auto"><button class="btn small" data-t="start">Start</button><button class="btn small ghost" data-t="reset">Reset</button></div></div>`;

/* ================= state ================= */
const store = {
  get(k, d){ try { const v = localStorage.getItem('b2lab-' + k); return v == null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('b2lab-' + k, v); } catch(e){} }
};
let LANG = store.get('lang', 'py');
function setLang(l){
  LANG = l; store.set('lang', l);
  document.body.classList.toggle('lang-py', l === 'py');
  document.body.classList.toggle('lang-java', l === 'java');
  document.querySelectorAll('[data-lang-btn]').forEach(b => b.setAttribute('aria-pressed', b.dataset.langBtn === l));
  document.dispatchEvent(new CustomEvent('langchange'));
}
function setTeacher(on){
  document.body.classList.toggle('tmode', on); store.set('teacher', on ? '1' : '0');
  const b = document.getElementById('tbtn'); if (b) b.setAttribute('aria-pressed', on);
  document.querySelectorAll('details.ans').forEach(d => d.open = on);
}
function setBig(on){
  document.body.classList.toggle('big', on); store.set('big', on ? '1' : '0');
  const b = document.getElementById('bigbtn'); if (b) b.setAttribute('aria-pressed', on);
}

/* ================= rendering ================= */
const lessonNo = l => LESSONS.indexOf(l) + 1;
function sidebar(cur){
  let h = `<a href="#home" ${!cur?'aria-current="page"':''}><span class="num">START</span>Course map</a>`;
  for (const u in UNITS){
    h += `<h4>${u} · ${UNITS[u]}</h4>`;
    LESSONS.filter(l => l.unit === u).forEach(l => {
      h += `<a href="#${l.id}" ${cur===l?'aria-current="page"':''}><span class="num">${l.code}</span><span>${l.title}</span>${l.hl?'<span class="hl-badge">HL</span>':''}</a>`;
    });
  }
  return h;
}
function renderHome(){
  const hero = C(`
    # Your first program
    name = input("What is your name? ")
    print("Hello, " + name + "!")`, `
    // Your first program
    Scanner sc = new Scanner(System.in);
    String name = sc.nextLine();
    System.out.println("Hello, " + name + "!");`, 'hello.' );
  let units = '';
  for (const u in UNITS){
    units += `<div class="unit-block"><h3>${u} · ${UNITS[u]}</h3><div class="unit-cards">${LESSONS.filter(l=>l.unit===u).map(l=>`<a class="lcard" href="#${l.id}"><span class="num">${l.code}${l.hl?' <span class="hl-badge">HL</span>':''}<span style="margin-left:auto;color:var(--muted);font-weight:400">Lesson ${lessonNo(l)}</span></span><b>${l.title}</b><small>${l.tagline}</small></a>`).join('')}</div></div>`;
  }
  return `<div class="wrap">
  <section class="hero">
    <div class="prose" style="gap:14px">
      <div class="eyebrow">IB DP COMPUTER SCIENCE · THEME B2 <span class="pill">${LESSONS.length} lessons</span></div>
      <h1>Learn to program, one small idea at a time.</h1>
      <p class="lead">Every lesson starts with a Do Now, explains one idea with a picture and something you can click, then gives you a 10-minute solo task, a group scenario task and exam-style home learning.</p>
      <div class="row"><a class="btn" href="#${LESSONS[0].id}" style="text-decoration:none">Start Lesson 1</a><span class="wnote">Choose Python or Java at the top. Every code example switches.</span></div>
    </div>
    <div class="hero-code">${hero}</div>
  </section>
  <section class="panel">
    <h2>How every lesson runs</h2>
    <div class="plan">
      <div><b>Do Now</b><span>5 min · starter</span><small>Quick recall questions on the board as students arrive.</small></div>
      <div><b>Learn</b><span>15–20 min</span><small>Analogy → picture → code → try the interactive.</small></div>
      <div><b>Check</b><span>3 min</span><small>Hinge question. Everyone answers before you move on.</small></div>
      <div><b>Task 1</b><span>10 min · solo</span><small>Timed individual practice, easy to stretch.</small></div>
      <div><b>Task 2</b><span>15 min · groups</span><small>A real-world scenario with roles for each student.</small></div>
      <div><b>Home learning</b><span>exam style</span><small>IB-style questions with marks and a mark scheme.</small></div>
    </div>
    <div class="grid3">
      <div class="mini"><h4>Teacher mode</h4><p>Switch on <b>Teacher mode</b> at the top to show delivery notes, likely misconceptions and every answer and mark scheme.</p></div>
      <div class="mini"><h4>Presenting</h4><p><b>Large text</b> makes the page readable on a projector. The timers in each task count down on screen.</p></div>
      <div class="mini"><h4>Explain each line</h4><p>Every code example has an <b>Explain each line</b> button. It puts a plain-English explanation next to each line, and <b>Next line ▶</b> walks through the code one line at a time. In the Learn section it is switched on already.</p></div>
      <div class="mini"><h4>Python or Java</h4><p>The concepts are the same in both languages. The switch changes every code example, trace and answer.</p></div>
    </div>
  </section>
  ${units}
  </div>`;
}

function renderLesson(l){
  const i = LESSONS.indexOf(l), prev = LESSONS[i-1], next = LESSONS[i+1];
  const phases = [['donow','Do Now','5'],['learn','Learn','20'],['check','Check','3'],['task1','Task 1','10'],['task2','Task 2','15'],['home','Home learning','']];
  const dn = l.doNow.map(d => `<div class="dn"><p>${d.q}</p>${REVEAL('Answer', d.a)}</div>`).join('');
  const kws = l.keywords.map(([t,d]) => `<div class="kw"><dt>${t}</dt><dd>${d}</dd></div>`).join('');
  const learn = l.learn.map((s,n) => `<div class="panel"><h3><span class="step-no">${String(n+1).padStart(2,'0')}</span>${s.h}</h3>${s.html}</div>`).join('');
  const t1 = l.task1, t2 = l.task2;
  const t1qs = t1.qs.map(q => `<li><span class="level l${q.lv}">${['','Start','Build','Stretch'][q.lv]}</span>${q.q}${q.a?REVEAL('Answer', q.a):''}</li>`).join('');
  const roles = (t2.roles || DEFAULT_ROLES).map(([r,d]) => `<div class="role"><b>${r}</b>${d}</div>`).join('');
  const home = l.home.map((q,n) => `<div class="eq"><div class="eq-head"><span class="qn">Q${n+1}</span><div>${q.q}</div><span class="marks">[${q.m}]</span></div>${REVEAL('Mark scheme', q.ms)}</div>`).join('');
  return `<div class="wrap">
  <header class="lesson-head">
    <div class="eyebrow">${l.code} · ${UNITS[l.unit].toUpperCase()} <span class="pill">Lesson ${i+1} of ${LESSONS.length}</span>${l.hl?'<span class="pill">HL only</span>':''}</div>
    <h1>${l.title}</h1>
    <p class="lead">${l.tagline}</p>
  </header>
  <nav class="phasebar" aria-label="Lesson phases">${phases.map(([id,n,m])=>`<a href="#${l.id}" data-jump="${id}">${n}${m?`<span>${m}′</span>`:''}</a>`).join('')}</nav>

  <div class="panel">
    <div><h3>By the end of this lesson you can…</h3><ul class="objectives" style="margin-top:10px">${l.objectives.map(o=>`<li>${o}</li>`).join('')}</ul></div>
    <div><h3>Key words</h3><dl class="kw-list" style="margin:10px 0 0">${kws}</dl></div>
  </div>

  <section class="phase" id="p-donow">
    <div class="phase-title"><span class="tag">Starter</span><h2>Do Now</h2><span class="mins">5 minutes · on your own, in silence</span></div>
    ${TIMER(5, 'Do Now')}
    <div class="donow">${dn}</div>

/* ================= behaviours ================= */
function wire(root){
  root.querySelectorAll('.mcq').forEach(m => {
    m.querySelectorAll('.opts button').forEach(b => b.addEventListener('click', () => {
      const ans = +m.dataset.ans, i = +b.dataset.i;
      m.querySelectorAll('.opts button').forEach(x => x.classList.remove('right','wrong'));
      b.classList.add(i === ans ? 'right' : 'wrong');
      m.querySelector(`.opts button[data-i="${ans}"]`).classList.add('right');
      const w = m.querySelector('.why'); w.hidden = false;
      w.innerHTML = (i === ans ? '<b style="color:var(--good)">Correct. </b>' : `<b style="color:var(--bad)">Not quite. The answer is ${'ABCD'[ans]}. </b>`) + w.dataset.why;
    }));
    const w = m.querySelector('.why'); w.dataset.why = w.innerHTML;
  });
  root.querySelectorAll('.timer').forEach(t => {
    let left = +t.dataset.min * 60, id = null;
    const clock = t.querySelector('.clock'), sb = t.querySelector('[data-t=start]');
    const draw = () => clock.textContent = `${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;
    sb.addEventListener('click', () => {
      if (id){ clearInterval(id); id = null; sb.textContent = 'Resume'; return; }
      if (left <= 0) return;
      sb.textContent = 'Pause';
      id = setInterval(() => { left--; draw(); if (left <= 0){ clearInterval(id); id = null; t.classList.add('done'); sb.textContent = 'Done'; } }, 1000);
    });
    t.querySelector('[data-t=reset]').addEventListener('click', () => { clearInterval(id); id = null; left = +t.dataset.min*60; draw(); t.classList.remove('done'); sb.textContent = 'Start'; });
  });
  // explain every code example in the Learn phase straight away
  root.querySelectorAll('#p-learn .code').forEach(c => { if (!c.closest('.widget')) toggleExplain(c, true); });
  root.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); const t = document.getElementById('p-' + a.dataset.jump); if (t) t.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  }));
  root.querySelectorAll('.widget[data-w]').forEach(el => {
    const f = WIDGETS[el.dataset.w];
    if (f){ try { f(el, el.dataset.opts); } catch(err){ el.innerHTML = `<div class="msg bad">This interactive failed to load: ${esc(err.message)}</div>`; console.error(err); } }
  });
  if (document.body.classList.contains('tmode')) root.querySelectorAll('details.ans').forEach(d => d.open = true);
}
function selectPre(pre){ const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

function route(){
  const id = location.hash.slice(1);
  const l = LESSONS.find(x => x.id === id);
  const main = document.getElementById('main');
  document.querySelectorAll('.widget').forEach(w => w._cleanup && w._cleanup());
  main.innerHTML = l ? renderLesson(l) : renderHome();
  document.getElementById('side').innerHTML = sidebar(l);
  document.title = l ? `${l.code} ${l.title} · B2 Programming Lab` : 'B2 Programming Lab';
  wire(main);
  closeMenu();
  window.scrollTo(0, 0);
}
function closeMenu(){ document.getElementById('side').classList.remove('open'); const s = document.querySelector('.scrim'); if (s) s.remove(); }

document.addEventListener('DOMContentLoaded', () => {
  setLang(LANG);
  setTeacher(store.get('teacher','0') === '1');
  setBig(store.get('big','0') === '1');
  document.querySelectorAll('[data-lang-btn]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.langBtn)));

  document.getElementById('bigbtn').addEventListener('click', () => setBig(!document.body.classList.contains('big')));

});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;

});

/* ================= line-by-line code explainer ================= */
const X = {
  C: s => `<code>${esc(String(s).trim())}</code>`,
  splitComment(line, lang){
    let q = null;
    for (let i = 0; i < line.length; i++){
      const ch = line[i];
      if (q){ if (ch === '\\'){ i++; continue; } if (ch === q) q = null; continue; }
      if (ch === '"' || ch === "'") { q = ch; continue; }
      if (lang === 'py' && ch === '#') return [line.slice(0, i), line.slice(i + 1).trim()];
      if (lang === 'java' && ch === '/' && line[i+1] === '/') return [line.slice(0, i), line.slice(i + 2).trim()];
    }
    return [line, ''];
  },
  // split on top-level commas
  args(s){
    const out = []; let d = 0, cur = '', q = null;
    for (const ch of s){
      if (q){ cur += ch; if (ch === q) q = null; continue; }
      if (ch === '"' || ch === "'"){ q = ch; cur += ch; continue; }
      if ('([{<'.includes(ch)) d++; if (')]}>'.includes(ch)) d--;
      if (ch === ',' && d === 0){ out.push(cur.trim()); cur = ''; continue; }
      cur += ch;
    }
    if (cur.trim()) out.push(cur.trim());
    return out;
  },
  // text inside the first balanced brackets after position i (which should be '(')
  group(t, i){
    let d = 0;
    for (let j = i; j < t.length; j++){
      if (t[j] === '(') d++;
      else if (t[j] === ')'){ d--; if (d === 0) return [t.slice(i + 1, j), t.slice(j + 1).trim()]; }
    }
    return [t.slice(i + 1), ''];
  },
  words(cond){
    let s = ' ' + cond.trim() + ' ';
    s = s.replace(/(\S+)\.equals\(([^)]*)\)/g, '$1 is equal to $2');
    s = s.replace(/len\((\w+)\)/g, 'the length of $1').replace(/(\w+)\.length\(\)/g, 'the length of $1').replace(/(\w+)\.length\b/g, 'the length of $1').replace(/(\w+)\.size\(\)/g, 'the size of $1');
    s = s.replace(/\s%\s*2\s*==\s*0/g, ' is even').replace(/\s%\s*2\s*(?:!=\s*0|==\s*1)/g, ' is odd');
    s = s.replace(/\s>=\s/g, ' is greater than or equal to ').replace(/\s<=\s/g, ' is less than or equal to ')
         .replace(/\s==\s/g, ' is equal to ').replace(/\s!=\s/g, ' is not equal to ')
         .replace(/\s>\s/g, ' is greater than ').replace(/\s<\s/g, ' is less than ')
         .replace(/\s(&&|and)\s/g, ' AND ').replace(/\s(\|\||or)\s/g, ' OR ').replace(/\snot\s/g, ' NOT ').replace(/!(\w)/g, 'NOT $1')
         .replace(/\s%\s/g, ' mod ');
    return esc(s.trim());
  },
  val(v, lang){
    v = v.trim();
    if (/^-?\d+$/.test(v)) return `the whole number ${v}`;
    if (/^-?\d*\.\d+$/.test(v)) return `the decimal number ${v}`;
    if (/^f?".*"$/.test(v) || /^'.{2,}'$/.test(v)) return `the text ${X.C(v)}`;
    if (/^'.'$/.test(v)) return lang === 'java' ? `the single character ${X.C(v)}` : `the text ${X.C(v)}`;
    if (/^(True|False|true|false)$/.test(v)) return `the Boolean value ${X.C(v)}`;
    if (v === 'None' || v === 'null') return `${X.C(v)} (nothing yet)`;
    return null;
  },
  typeWord(t){
    const base = t.replace(/\[\]/g, '');
    const dims = (t.match(/\[\]/g) || []).length;
    const w = { int:'whole number', double:'decimal number', float:'decimal number', long:'big whole number', short:'small whole number', byte:'tiny whole number', char:'single character', boolean:'true/false value', String:'text (String)' }[base];
    if (dims === 2) return `2D array (grid) of ${w ? w + 's' : base}`;
    if (dims === 1) return `array of ${w ? w + 's' : base}`;
    if (/^ArrayList/.test(t)) return `ArrayList (a list that can grow) of ${(t.match(/<(.*)>/) || [,'items'])[1]}`;
    return w || base;
  },
  method(obj, m, a, lang){
    const A = a ? X.C(a) : '', O = X.C(obj);
    const map = {
      append: `Adds ${A} to the <b>end</b> of the list ${O}.`,
      add: `Adds ${A} to ${O}.`,
      push: `<b>Pushes</b> ${A} onto the top of the stack ${O}.`,
      pop: a ? `Removes the item at index ${A} from ${O}.` : `<b>Pops</b>: removes the last (top) item from ${O}.`,
      peek: `Looks at the top item of ${O} without removing it.`,
      enqueue: `Adds ${A} to the rear of the queue ${O}.`,
      dequeue: `Removes the item at the front of the queue ${O}.`,
      remove: `Removes ${A} from ${O}.`,
      insert: `Inserts a value into ${O} at a chosen position (${A}).`,
      set: `Changes an item in ${O}: ${A} (index, new value).`,
      get: `Gets the item at index ${A} from ${O}.`,
      write: `Writes ${A} into the file.`,
      close: `Closes the file / resource ${O} so everything is saved and released.`,
      clear: `Empties ${O}: removes every item.`,
      sort: `Sorts ${O} into order.`,
      start: `Starts the thread ${O} running.`,
      displayQueue: `Shows the contents of the queue.`,
      print: `Prints ${A} and stays on the <b>same</b> line.`,
      println: `Prints ${A} and then moves to a <b>new line</b>.`
    };
    return map[m] || `Calls the ${X.C(m)} method on ${O}${a ? ` with ${A}` : ''}.`;
  },
  an(w){ return /^[aeiou]/i.test(String(w).replace(/<[^>]+>/g,'')) ? 'an' : 'a'; },
  describe(e){
    let m; const C = X.C;
    if ((m = e.match(/^(\w+)\.substring\(([^,()]+),\s*([^()]+)\)$/))) return `the part of ${C(m[1])} from index ${C(m[2])} up to (not including) ${C(m[3])}`;
    if ((m = e.match(/^(\w+)\.substring\(([^(),]+)\)$/))) return `the part of ${C(m[1])} from index ${C(m[2])} to the end`;
    if ((m = e.match(/^(\w+)\[([^\]:]*):([^\]:]*)\]$/))) return `the slice of ${C(m[1])} ${m[2] ? `from index ${C(m[2])}` : 'from the start'} ${m[3] ? `up to (not including) ${C(m[3])}` : 'to the end'}`;
    if ((m = e.match(/^(\w+)\.charAt\((.+)\)$/))) return `the character at index ${C(m[2])} of ${C(m[1])}`;
    if ((m = e.match(/^(\w+)\.(indexOf|find)\((.+)\)$/))) return `the position (index) of ${C(m[3])} inside ${C(m[1])}, or −1 if it is not there`;
    if ((m = e.match(/^len\((.+)\)$/)) || (m = e.match(/^(\w+)\.length(?:\(\))?$/)) || (m = e.match(/^(\w+)\.size\(\)$/))) return `how many items / characters are in ${C(m[1])}`;
    if ((m = e.match(/^(.+)\.(upper|toUpperCase)\(\)$/))) return `${C(m[1])} in CAPITAL letters`;
    if ((m = e.match(/^(.+)\.(lower|toLowerCase)\(\)$/))) return `${C(m[1])} in small letters`;
    if ((m = e.match(/^(.+)\.(strip|trim)\(\)$/))) return `${C(m[1])} with spaces and the newline removed from the ends`;
    if ((m = e.match(/^(.+)\.split\((.*)\)$/))) return `the pieces of ${C(m[1])}, cut at each ${m[2] ? C(m[2]) : 'space'}`;
    if ((m = e.match(/^(.+)\.replace\((.+)\)$/))) { const a = X.args(m[2]); return `${C(m[1])} with ${C(a[0])} replaced by ${C(a[1] || '')}`; }
    if ((m = e.match(/^Integer\.parseInt\((.+)\)$/)) || (m = e.match(/^int\((.+)\)$/))) return `${C(m[1])} converted into a whole number`;
    if ((m = e.match(/^Double\.parseDouble\((.+)\)$/)) || (m = e.match(/^float\((.+)\)$/))) return `${C(m[1])} converted into a decimal number`;
    if ((m = e.match(/^str\((.+)\)$/))) return `${C(m[1])} converted into text`;
    if ((m = e.match(/^round\((.+)\)$/))) { const a = X.args(m[1]); return `${C(a[0])} rounded${a[1] ? ` to ${a[1]} decimal places` : ' to a whole number'}`; }
    if (/^[A-Za-z_]\w*$/.test(e)) return `a copy of the value in ${C(e)}`;
    if (/[+\-*/%]/.test(e) && !/[=<>]/.test(e)) return `the answer to ${C(e)}`;
    return null;
  },
  rhs(expr, lang){
    const e = expr.trim();
    const v = X.val(e, lang); if (v) return v;
    let m;
    if (/input\(/.test(e)){
      const pr = (e.match(/input\((.*?)\)/) || [])[1];
      const conv = /^int\(/.test(e) ? ', converts it to a whole number' : /^float\(/.test(e) ? ', converts it to a decimal number' : '';
      return `what the user types${pr ? ` (after showing the prompt ${X.C(pr)})` : ''}${conv}`;
    }
    if (/\.nextInt\(\)/.test(e)) return 'a whole number typed by the user';
    if (/\.nextDouble\(\)/.test(e)) return 'a decimal number typed by the user';
    if (/\.nextLine\(\)/.test(e) && !/parse/.test(e)) return 'the next line of text (typed by the user or read from the file)';
    if (/^(Integer\.parseInt|Double\.parseDouble)\(\w+\.nextLine\(\)\)$/.test(e)) return `the next line typed by the user, converted into ${/Integer/.test(e) ? 'a whole' : 'a decimal'} number`;
    if (e === '[]') return 'an empty list';
    if ((m = e.match(/^\[(.+)\]\s*\*\s*(\w+)$/))) return `a list with ${X.C(m[2])} places, each starting as ${X.C(m[1])}`;
    if ((m = e.match(/^\[(.*)\]$/)) && !/ for /.test(e)) return `a list of ${X.args(m[1]).length} items: ${X.C(e)}`;
    if ((m = e.match(/^\{(.*)\}$/))) return `the values ${X.C(e)}`;
    if ((m = e.match(/^new (\w+)((?:\[\w*\])+)$/))) { const n = m[2].match(/\w+/g) || []; return n.length === 2 ? `a new grid with ${n[0]} rows and ${n[1]} columns (every place starts as 0)` : `a new array with ${n[0]} places (each starts as 0 / empty)`; }
    if (/^new ArrayList/.test(e)) return 'a new, empty ArrayList that can grow';
    if (/^new Scanner\(System\.in\)/.test(e)) return 'a Scanner that reads what the user types';
    if (/^new Scanner\(/.test(e)) return 'a Scanner that reads from the file';
    if (/^new HashSet/.test(e) || e === 'set()') return 'an empty set (a collection with no duplicates)';
    if (/^deque\(\)/.test(e)) return 'an empty deque (a fast queue)';
    if ((m = e.match(/^(\w+)\.pop\(\)$/))) return `the last item removed from ${X.C(m[1])}`;
    if ((m = e.match(/^(\w+)\[(.+)\]$/)) && !/:/.test(m[2])) return `the item at index ${X.C(m[2])} of ${X.C(m[1])}`;
    const d = X.describe(e); if (d) return d;
    if (/^(\w+)\((.*)\)$/.test(e)) return `the value returned by calling ${X.C(e)}`;
    if (/ if .* else /.test(e) || / \? .* : /.test(e)) return `one of two values, chosen by a condition: ${X.C(e)}`;
    return `the result of ${X.C(e)}`;
  },
  assign(target, expr, lang){
    const t = target.trim(), e = expr.trim(); let m;
    if ((m = t.match(/^(\w+)\[(.+)\]$/))) return `Changes the item at position ${X.C(m[2])} of ${X.C(m[1])} to ${X.rhs(e, lang)}.`;
    if ((m = t.match(/^self\.(\w+)$/)) || (m = t.match(/^this\.(\w+)$/))) return `Stores ${X.rhs(e, lang)} in this object’s ${X.C(m[1])}.`;
    const self = new RegExp('^' + t.replace(/[.\[\]]/g, '\\$&') + '\\s*([+\\-*/%])\\s*(.+)$');
    if ((m = e.match(self))){
      const op = { '+':'adds', '-':'subtracts', '*':'multiplies by', '/':'divides by', '%':'takes the remainder after dividing by' }[m[1]];
      if (m[1] === '+' && m[2].trim() === '1') return `Adds 1 to ${X.C(t)} (counting up by one).`;
      if (m[1] === '-' && m[2].trim() === '1') return `Subtracts 1 from ${X.C(t)} (counting down by one).`;
      return `Takes the current value of ${X.C(t)}, ${op} ${X.C(m[2])}, and stores the answer back in ${X.C(t)}.`;
    }
    if (/^[A-Za-z_]\w*$/.test(e) && !X.val(e, lang)) return `Copies the value of ${X.C(e)} into ${X.C(t)}.`;
    return `Stores ${X.rhs(e, lang)} in the variable ${X.C(t)}.`;
  },
  call(t, lang){
    let m;
    if ((m = t.match(/^print\((.*)\)$/))){
      if (!m[1].trim()) return 'Prints an empty line, so the next output starts on a new line.';
      const n = X.args(m[1]).filter(x => !/^(end|sep)\s*=/.test(x)).length, d = n === 1 ? X.describe(m[1].trim()) : null;
      return `<b>Output:</b> shows ${d && !/^a copy/.test(d) ? d : X.C(m[1])} on the screen${n > 1 ? ' (the parts are separated by spaces)' : ''}${/end\s*=/.test(m[1]) ? ' and stays on the same line (because of <code>end=</code>)' : ''}.`;
    }
    if ((m = t.match(/^System\.out\.(println|print)\((.*)\)$/))) { const d = X.describe(m[2].trim()); return m[2].trim() ? `<b>Output:</b> shows ${d && !/^a copy/.test(d) && !/^the answer/.test(d) ? d : X.C(m[2])} on the screen, then ${m[1] === 'println' ? 'moves to a <b>new line</b>' : 'stays on the <b>same line</b>'}.` : 'Prints an empty line.'; }
    if ((m = t.match(/^([\w.\[\]()]+?)\.(\w+)\((.*)\)$/))) return X.method(m[1], m[2], m[3].trim(), lang);
    if ((m = t.match(/^(\w+)\((.*)\)$/))) return `<b>Calls</b> (runs) the function ${X.C(m[1])}${m[2].trim() ? ` with the argument${X.args(m[2]).length > 1 ? 's' : ''} ${X.C(m[2])}` : ''}.`;
    return null;
  },
  py(t){
    let m;
    if (/^(if|elif|while|for|def|class|else|try|except|finally|with)\b/.test(t) && !t.endsWith(':')) return `⚠️ <b>Syntax error:</b> this line should end with a colon <code>:</code>. Python will refuse to run the program. With the colon it would mean: ${X.py(t + ':')}`;
    if (/^[\[(].*[\])],?$/.test(t)) return `One row of values: ${X.C(t.replace(/,$/, ''))}.`;
    if (/[+,(\[]$/.test(t) && !/^\w+\s*=\s*[\[(]$/.test(t)) return `This statement continues on the next line: ${X.C(t)}`;
    if ((m = t.match(/^def (\w+)\((.*)\):$/))){
      X.fn = m[1];
      if (m[1] === '__init__') return 'The <b>constructor</b>: runs automatically when a new object is made, to set up its starting values.';
      const ps = m[2].replace(/\bself,?\s*/, '').trim();
      return `<b>Defines a function</b> called ${X.C(m[1])}${ps ? ` with parameter${X.args(ps).length > 1 ? 's' : ''} ${X.C(ps)} (the inputs it receives)` : ' that takes no inputs'}. The indented lines below are its body. They only run when the function is called.`;
    }
    if ((m = t.match(/^class (\w+)/))) return `Creates a <b>class</b> called ${X.C(m[1])}: a blueprint for making objects.`;

  java(t, blocks){

    if (/^do\s*{$/.test(t)){ push('do-while loop'); return '<b>do-while loop:</b> runs the lines in the braces at least once, then checks the condition at the bottom.'; }

  explain(src, lang){

function buildExplain(codeEl){
  const pre = codeEl.querySelector('pre'), lang = pre.dataset.lang, src = pre.dataset.src;
  const lines = src.split('\n'), ex = X.explain(src, lang), hlt = hl(src, lang).split('\n');
  const rows = lines.map((l, i) => `<div class="xrow ${ex[i] ? '' : 'blank'}" data-i="${i}"><span class="xn">${i + 1}</span><span class="xc">${hlt[i] || ' '}</span><span class="xe">${ex[i]}</span></div>`).join('');
  const box = document.createElement('div');
  box.className = 'xwrap';
  box.innerHTML = `<div class="xview">${rows}</div><div class="xbar"><button type="button" class="btn small" data-xs="prev">◀ Previous line</button><button type="button" class="btn small" data-xs="next">Next line ▶</button><button type="button" class="btn small ghost" data-xs="all">Show all</button><span class="xpos">Click any line, or step through</span></div>`;
  pre.after(box);
  const view = box.querySelector('.xview'), rowsEl = [...view.children], real = rowsEl.filter(r => !r.classList.contains('blank'));
  let cur = -1;
  const show = k => {
    cur = k; const target = real[k];
    view.classList.toggle('stepping', k >= 0);
    const ti = target ? +target.dataset.i : -1;
    rowsEl.forEach(r => { r.classList.toggle('on', r === target); r.classList.toggle('after', ti >= 0 && +r.dataset.i > ti); });
    box.querySelector('.xpos').textContent = k >= 0 ? `Line ${ti + 1} of ${lines.length}` : 'Click any line, or step through';
  };
  box.querySelector('[data-xs=next]').addEventListener('click', () => show(Math.min(real.length - 1, cur + 1)));
  box.querySelector('[data-xs=prev]').addEventListener('click', () => show(Math.max(0, cur - 1)));
  box.querySelector('[data-xs=all]').addEventListener('click', () => show(-1));
  rowsEl.forEach(r => r.addEventListener('click', () => { const k = real.indexOf(r); if (k >= 0) show(k); }));
}
function toggleExplain(codeEl, on){
  const pre = codeEl.querySelector('pre'), btn = codeEl.querySelector('[data-explain]');
  if (!btn) return;
  if (on === undefined) on = btn.getAttribute('aria-pressed') !== 'true';
  if (on && !codeEl.querySelector('.xwrap')) buildExplain(codeEl);
  const w = codeEl.querySelector('.xwrap'); if (w) w.hidden = !on;
  pre.hidden = on;
  btn.setAttribute('aria-pressed', on);
  btn.textContent = on ? 'Show plain code' : 'Explain each line';
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-explain]');
  if (b) toggleExplain(b.closest('.code'));
});

/* ================= interactive widgets ================= */
const WIDGETS = {};
const $ = (root, s) => root.querySelector(s);
const $$ = (root, s) => [...root.querySelectorAll(s)];
function head(title, note){ return `<div class="wtitle"><span class="try">Try it</span><b>${title}</b></div>${note?`<p class="wnote">${note}</p>`:''}`; }
function onLang(el, fn){
  const h = () => { if (document.body.contains(el)) fn(); };
  document.addEventListener('langchange', h);
  const prev = el._cleanup;
  el._cleanup = () => { document.removeEventListener('langchange', h); prev && prev(); };
}
function timers(el){ const ids = []; const prev = el._cleanup; el._cleanup = () => { ids.forEach(clearTimeout); prev && prev(); }; return { later(fn, ms){ ids.push(setTimeout(fn, ms)); }, clear(){ ids.forEach(clearTimeout); ids.length = 0; } }; }
const py = () => LANG === 'py';
function codeLines(el, src, lang){ el.innerHTML = codeBlock(dedent(src), lang); }
function setActive(codeEl, lines){ $$(codeEl, '.ln').forEach(l => l.classList.toggle('active', lines.includes(+l.dataset.ln))); }

/* ---------- 1. variables as labelled boxes ---------- */
WIDGETS.vars = el => {
  let mem;
  const reset = () => { mem = py()
    ? [['age','16','int'],['name','"Aisha"','str'],['passed','True','bool']]
    : [['age','16','int'],['name','"Aisha"','String'],['passed','true','boolean']].map(x=>x); };
  el.innerHTML = head('Variables are labelled boxes', 'Type a name and a value, then press <b>Store it</b>. The computer decides the data type from the value you typed.') + `
  <div class="row"><label class="lbl">Name <input type="text" class="vn" value="score" size="10"></label>
  <label class="lbl">Value <input type="text" class="vv" value="42" size="12"></label>
  <button class="btn st" type="button">Store it</button><button class="btn ghost rs" type="button">Reset</button></div>
  <div class="out cl"><span class="dim">The line of code you create will appear here.</span></div><div class="msg m">Memory has 3 boxes in it already.</div><div class="membox"></div>
  <p class="wnote">Try values <code>3.5</code>, <code>"Ben"</code>, <code>'A'</code>, <code>hello</code> (no quotes) and names like <code>1st_place</code> or <code>my score</code>. Store the same name twice to see the old value get replaced.</p>`;
  const box = $(el,'.membox'), msg = $(el,'.m'), cl = $(el,'.cl');
  const draw = (changed, old) => {
    box.innerHTML = mem.map(([n,v,t]) => `<div class="vbox"><div class="vn"><span>${esc(n)}</span><span class="typetag">${t}</span></div><div class="vv">${n===changed && old!=null?`<s>${esc(old)}</s>`:''}${esc(v)}</div></div>`).join('');
  };
  const typeOf = v => {
    if (/^-?\d+$/.test(v)) return ['int'];
    if (/^-?\d+\.\d+$/.test(v)) return [py()?'float':'double'];
    if (/^".*"$/.test(v)) return [py()?'str':'String'];
    if (/^'.'$/.test(v)) return [py()?'str':'char'];
    if (/^'.{2,}'$/.test(v)) return py()?['str']:[null,"In Java, single quotes hold exactly ONE character. Use double quotes for text: \"like this\"."];
    if (v === 'True' || v === 'False') return py()?['bool']:[null,'Java writes booleans in lowercase: true or false.'];
    if (v === 'true' || v === 'false') return py()?[null,'Python writes booleans with a capital letter: True or False.']:['boolean'];
    if (v === '') return [null,'Type a value first.'];
    return [null, `<code>${esc(v)}</code> is not a value. Text needs quotes, otherwise the computer thinks it is the name of another variable.`];
  };
  const store = () => {
    const n = $(el,'.vn').value.trim(), v = $(el,'.vv').value.trim();
    const bad = !n ? 'Give the box a name.' : /^\d/.test(n) ? 'A name cannot start with a digit.' : /[\s]/.test(n) ? 'A name cannot contain spaces. Try my_score or myScore.' : /-/.test(n) ? 'A hyphen means minus. Use an underscore instead.' : !/^[A-Za-z_]\w*$/.test(n) ? 'Names may only use letters, digits and _.' : KW[LANG].has(n) ? `<code>${esc(n)}</code> is a reserved keyword in ${py()?'Python':'Java'}.` : null;
    if (bad){ msg.className = 'm msg bad'; msg.innerHTML = 'Invalid name. ' + bad; return; }
    const [t, err] = typeOf(v);
    if (!t){ msg.className = 'm msg bad'; msg.innerHTML = err; return; }
    const ex = mem.find(x => x[0] === n);
    if (ex && !py() && ex[2] !== t){ msg.className = 'm msg bad'; msg.innerHTML = `<code>${esc(n)}</code> was declared as <b>${ex[2]}</b>. In Java a variable keeps its type for ever, so it cannot hold a ${t}.`; return; }
    cl.textContent = py() ? `${n} = ${v}` : (ex ? `${n} = ${v};` : `${t} ${n} = ${v};`);
    if (ex){ const old = ex[1]; ex[1] = v; ex[2] = t; msg.className = 'm msg warn'; msg.innerHTML = `The box <code>${esc(n)}</code> already existed. Its old value <b>${esc(old)}</b> is thrown away. A variable holds one value at a time.`; draw(n, old); }
    else { mem.push([n,v,t]); msg.className = 'm msg good'; msg.innerHTML = `New box <code>${esc(n)}</code> made. Data type: <b>${t}</b>.`; draw(); }
  };
  $(el,'.st').addEventListener('click', store);
  $(el,'.rs').addEventListener('click', () => { reset(); draw(); cl.textContent=''; msg.className = 'm msg'; msg.textContent='Memory reset.'; });
  reset(); draw();
  onLang(el, () => { reset(); draw(); cl.textContent=''; msg.className = 'm msg'; msg.textContent = `Switched to ${py()?'Python':'Java'}. Notice the type names change.`; });
};

/* ---------- 2. global vs local scope ---------- */
WIDGETS.scope = el => {
  const render = () => {
    const pyc = `
      score = 10              # global: made outside any function

      def add_bonus():

      def greet():

WIDGETS.tryflow = el => {
  const T = timers(el);
  el.innerHTML = head('What happens when something goes wrong?', 'Set the numbers and press <b>Run</b>. Then switch the safety net off and run it again with 0.') + `
  <div class="row"><label class="lbl">a <input type="number" class="a" value="10"></label><label class="lbl">b <input type="number" class="b" value="0"></label>
  <label class="lbl"><input type="checkbox" class="safe" checked> Use try / ${'<span class="only-py">except</span><span class="only-java">catch</span>'}</label>
  <button class="btn run" type="button">Run</button></div>
  <div class="flow f"></div><div class="out o"></div>`;
  const f = $(el,'.f'), o = $(el,'.o');
  const run = () => {
    T.clear();
    const a = Math.trunc(+$(el,'.a').value), b = Math.trunc(+$(el,'.b').value), safe = $(el,'.safe').checked;
    const err = py() ? 'ZeroDivisionError: division by zero' : 'ArithmeticException: / by zero';
    const q = Math.round(a/b*1e6)/1e6; const res = py() ? (Number.isInteger(q) ? q + '.0' : String(q)) : String(Math.trunc(a/b));
    let nodes, outs;
    if (safe){
      nodes = [['try:  result = a / b', b===0?'err':'yes'],
        b===0 ? [`${py()?'except ZeroDivisionError':'catch (ArithmeticException e)'}:  print a friendly message`, 'yes'] : ['print the result', 'yes'],
        ['finally:  print "Calculation finished"', 'yes'], ['program carries on to the next line', 'yes']];
      outs = [b===0 ? 'You cannot divide by zero. Try another number.' : `Result: ${res}`, 'Calculation finished', '…rest of program runs'];
    } else {
      nodes = b===0 ? [['result = a / b','err'],['CRASH: the program stops here','err'],['print the result (never runs)','no'],['rest of the program (never runs)','no']]
                    : [['result = a / b','yes'],['print the result','yes'],['rest of the program','yes']];
      outs = b===0 ? [`<span class="err">Traceback… ${err}</span>`] : [`Result: ${res}`, '…rest of program runs'];
    }
    f.innerHTML = nodes.map(([t]) => `<div class="fnode">${esc(t)}</div>`).join('<div class="arrow">↓</div>');
    o.innerHTML = '';
    nodes.forEach(([,k], i) => T.later(() => { f.querySelectorAll('.fnode')[i].classList.add(k); }, 450*i));
    T.later(() => { o.innerHTML = outs.join('\n'); if (!py() && b!==0 && a % b !== 0) o.innerHTML += `\n<span class="dim">Note: Java int ÷ int drops the decimals, so ${a}/${b} = ${res}.</span>`; }, 450*nodes.length);
  };
  $(el,'.run').addEventListener('click', run);
  run(); onLang(el, run);
};

    $(el,'.pt').innerHTML = `front = ${front}, rear = ${rear}, size = ${size}. New rear = (rear + 1) % ${CAP}.`;
  };
  $(el,'.en').addEventListener('click', () => { const x = 'P' + next;
    if (size === CAP) return log(`enqueue("${x}") → QUEUE OVERFLOW: queue is full`, 'err');
    const old = rear; rear = (rear + 1) % CAP; q[rear] = x; size++; next++; draw();
    log(`enqueue("${x}") → rear = (${old} + 1) % ${CAP} = ${rear}${old===CAP-1?'  ← wrapped round to the start!':''}`); });
  $(el,'.dq').addEventListener('click', () => { if (!size) return log('dequeue() → QUEUE UNDERFLOW: nothing to remove', 'err');
    const x = q[front]; q[front] = null; const old = front; front = (front + 1) % CAP; size--; draw(); log(`dequeue() → "${x}"  front moves ${old} → ${front}`); });
  $(el,'.fr').addEventListener('click', () => size ? log(`front() → "${q[front]}" (nothing removed)`) : log('front() → QUEUE UNDERFLOW: empty', 'err'));

/* ---------- 11. Parsons puzzle (put lines in order) ---------- */
const PUZZLES = {
  swap: { title: 'Swap the drinks in two cups', ok: [[0,1,2,3,4,5],[1,0,2,3,4,5]],
    py: ['a = "orange juice"','b = "milk"','temp = a','a = b','b = temp','print(a, b)'],
    java: ['String a = "orange juice";','String b = "milk";','String temp = a;','a = b;','b = temp;','System.out.println(a + " " + b);'] },
  tickets: { title: 'Cinema tickets with a group discount', ok: [[0,1,2,3,4,5],[1,0,2,3,4,5]],
    py: ['price = 8','tickets = int(input("How many tickets? "))','total = price * tickets','if tickets >= 5:','    total = total - 10','print("Pay", total)'],
    java: ['int price = 8;','int tickets = sc.nextInt();','int total = price * tickets;','if (tickets >= 5) {','    total = total - 10;','}','System.out.println("Pay " + total);'], okJava: [[0,1,2,3,4,5,6],[1,0,2,3,4,5,6]] }
};
WIDGETS.parsons = (el, name) => {
  const P = PUZZLES[name];
  let order;
  const shuffle = (n, rand) => { if (!rand){ const out = [3,0,5,1,4,2,6].filter(x => x < n); if (out.length === n) return out; }
    const a = [...Array(n).keys()]; do { for (let i=n-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } } while (a.every((v,i)=>v===i)); return a; };
  const render = (rand) => {
    const lines = P[LANG]; order = shuffle(lines.length, rand === true);
    el.innerHTML = head(`Put the lines in order: ${P.title}`, 'Use ▲ ▼ to move each line. Then press <b>Check</b>. The computer runs lines from top to bottom, so order matters.') + `<div class="parsons pz"></div>
    <div class="row"><button class="btn ck" type="button">Check</button><button class="btn ghost sh" type="button">Shuffle again</button></div><div class="msg m">Not checked yet.</div>`;
    draw();
    $(el,'.ck').addEventListener('click', check);
    $(el,'.sh').addEventListener('click', () => render(true));
  };
  const draw = (marks) => {
    const lines = P[LANG];
    $(el,'.pz').innerHTML = order.map((k,i) => `<div class="pline ${marks?(marks[i]?'ok':'no'):''}"><pre>${hl(lines[k], LANG)}</pre><button type="button" data-u="${i}" aria-label="Move up">▲</button><button type="button" data-d="${i}" aria-label="Move down">▼</button></div>`).join('');
    $$(el,'[data-u]').forEach(b => b.addEventListener('click', () => { const i=+b.dataset.u; if(i>0){ [order[i-1],order[i]]=[order[i],order[i-1]]; draw(); } }));
    $$(el,'[data-d]').forEach(b => b.addEventListener('click', () => { const i=+b.dataset.d; if(i<order.length-1){ [order[i+1],order[i]]=[order[i],order[i+1]]; draw(); } }));
  };
  const check = () => {
    const oks = (LANG==='java' && P.okJava) ? P.okJava : P.ok;
    const best = oks.map(ok => ok.map((v,i) => order[i] === v)).sort((x,y) => y.filter(Boolean).length - x.filter(Boolean).length)[0];
    draw(best); const right = best.filter(Boolean).length, m = $(el,'.m');
    if (right === order.length){ m.className = 'm msg good'; m.textContent = 'Correct order! Every line runs after the lines it depends on.'; }
    else { m.className = 'm msg bad'; m.textContent = `${right} of ${order.length} lines are in a correct place. Red lines are in the wrong place. Ask: does this line use a variable that has not been made yet?`; }
  };
  render(); onLang(el, render);
};

/* ---------- 12. selection: if / elif chain vs separate ifs ---------- */
WIDGETS.selection = el => {
  const render = () => {
    el.innerHTML = head('Follow the decision path', 'Drag the score. Highlighted lines are the ones the computer actually runs. Then switch to “separate ifs” to see a classic bug.') + `
    <div class="row"><label class="lbl">score <input type="range" class="s" min="0" max="100" value="84"></label><b class="sv" style="font-family:var(--f-code);font-size:1.2rem">84</b>
    <div class="seg md" role="group" aria-label="Structure"><button type="button" data-m="chain" aria-pressed="true">${py()?'if / elif / else':'if / else if / else'}</button><button type="button" data-m="sep" aria-pressed="false">separate ifs</button></div></div>
    <div class="grid2"><div class="cd"></div><div><div class="flow fl"></div><div class="out o" style="margin-top:10px"></div></div></div>`;
    let mode = 'chain';
    const draw = () => {
      const s = +$(el,'.s').value; $(el,'.sv').textContent = s;
      const chain = mode === 'chain';
      const src = py()
        ? (chain ? `if score >= 90:\n    grade = "A"\nelif score >= 80:\n    grade = "B"\nelif score >= 70:\n    grade = "C"\nelse:\n    grade = "Keep practising"\nprint(grade)`
                 : `if score >= 90:\n    print("A")\nif score >= 80:\n    print("B")\nif score >= 70:\n    print("C")`)
        : (chain ? `if (score >= 90) {\n    grade = "A";\n} else if (score >= 80) {\n    grade = "B";\n} else if (score >= 70) {\n    grade = "C";\n} else {\n    grade = "Keep practising";\n}\nSystem.out.println(grade);`
                 : `if (score >= 90) {\n    System.out.println("A");\n}\nif (score >= 80) {\n    System.out.println("B");\n}\nif (score >= 70) {\n    System.out.println("C");\n}`);
      $(el,'.cd').innerHTML = codeBlock(src, LANG);
      const tests = [[90,'A'],[80,'B'],[70,'C']];
      const act = [], nodes = [], outs = [];
      if (chain){
        let done = false;
        tests.forEach(([t,g],k) => {
          if (done){ nodes.push([`score >= ${t} ?  skipped`, 'no']); return; }
          const ok = s >= t; act.push(py()? k*2 : k*2); nodes.push([`score >= ${t} ?  ${ok?'YES':'no'}`, ok?'yes':'lit']);
          if (ok){ act.push(py()? k*2+1 : k*2+1); outs.push(g); done = true; }
        });
        if (!done){ act.push(py()?6:6, 7); nodes.push(['else  → none were true', 'yes']); outs.push('Keep practising'); }
        act.push(py()?8:9);
        $(el,'.o').innerHTML = `${outs[0]}\n<span class="dim">Exactly one branch ran. Once a test is true, the rest are skipped.</span>`;
      } else {
        tests.forEach(([t,g],k) => { const ok = s >= t; act.push(py()? k*2 : k*3); nodes.push([`score >= ${t} ?  ${ok?'YES':'no'}`, ok?'yes':'lit']); if (ok){ act.push(py()? k*2+1 : k*3+1); outs.push(g); } });
        $(el,'.o').innerHTML = (outs.length ? outs.join('\n') : '<span class="dim">(nothing printed)</span>') + (outs.length > 1 ? `\n<span class="err">${outs.length} grades printed! Every separate if is checked, even after one was true.</span>` : '');
      }
      setActive($(el,'.cd'), act);
      $(el,'.fl').innerHTML = nodes.map(([t,k]) => `<div class="fnode dec ${k}">${t}</div>`).join('<div class="arrow">↓</div>');
    };
    $(el,'.s').addEventListener('input', draw);
    $$(el,'.md button').forEach(b => b.addEventListener('click', () => { mode = b.dataset.m; $$(el,'.md button').forEach(x => x.setAttribute('aria-pressed', x===b)); draw(); }));
    draw();
  };
  render(); onLang(el, render);
};

WIDGETS.loops = el => {
  const T = timers(el);
  el.innerHTML = head('How many times does the loop run?', 'Set start, stop and step. Press <b>Run loop</b> to watch the loop variable <code>i</code> change on each pass.') + `
  <div class="row"><label class="lbl">start <input type="number" class="a" value="0"></label><label class="lbl">stop <input type="number" class="b" value="5"></label><label class="lbl">step <input type="number" class="c" value="1"></label><button class="btn go" type="button">Run loop</button></div>
  <div class="cl"></div><div class="tiles t"></div><div class="msg m"></div>`;
  const run = () => {
    T.clear();
    const a = Math.trunc(+$(el,'.a').value), b = Math.trunc(+$(el,'.b').value), c = Math.trunc(+$(el,'.c').value), m = $(el,'.m');
    const op = c > 0 ? '<' : '>';
    const src = py() ? `for i in range(${a}, ${b}, ${c}):\n    print(i)` : `for (int i = ${a}; i ${op} ${b}; i += ${c}) {\n    System.out.println(i);\n}`;
    $(el,'.cl').innerHTML = codeBlock(src, LANG); $(el,'.t').innerHTML = '';
    if (c === 0){ m.className = 'm msg bad'; m.innerHTML = py() ? 'A step of 0 is not allowed. Python stops with <code>ValueError: range() arg 3 must not be zero</code>.' : 'With a step of 0, <code>i</code> never changes, so the condition is always true: an <b>infinite loop</b>.'; return; }
    const vals = []; for (let i = a; c > 0 ? i < b : i > b; i += c){ vals.push(i); if (vals.length > 40) break; }
    if (!vals.length){ m.className = 'm msg warn'; m.innerHTML = `The condition is false straight away, so the loop body runs <b>0 times</b>.`; return; }
    m.className = 'm msg'; m.textContent = 'Running…';
    vals.slice(0,40).forEach((v,k) => T.later(() => { $(el,'.t').insertAdjacentHTML('beforeend', `<span class="tile">${v}</span>`); }, 220*k));
    T.later(() => { m.className = 'm msg good'; m.innerHTML = `The loop ran <b>${vals.length>40?'40+':vals.length}</b> time${vals.length===1?'':'s'}. It stopped because the next value, ${vals[vals.length-1]+c}, is not ${op} ${b}. <b>The stop value is never printed.</b>`; }, 220*Math.min(40,vals.length));
  };
  $(el,'.go').addEventListener('click', run);
  run(); onLang(el, run);
};

/* ---------- 16. Big O growth ---------- */
WIDGETS.bigo = el => {
  el.innerHTML = head('How fast does the work grow?', 'Move <b>n</b> (the number of items). Each line shows how many steps an algorithm needs.') + `
  <div class="row"><label class="lbl">n = <input type="range" class="n" min="1" max="20" value="8"></label><b class="nv" style="font-family:var(--f-code)">8</b></div>

  <div class="scroll-x"><svg class="svgchart ch" viewBox="0 0 560 300" width="560" height="300" role="img" aria-label="Growth of O(1), O(log n), O(n) and O(n squared)"></svg></div>
  <div class="tbl tb"></div>`;
  const COLS = { c:'var(--good)', l:'#1D4ED8', n:'var(--warn)', q:'var(--bad)' };

    s += `<line class="ax" x1="${X0}" y1="${Y0}" x2="${X0+W}" y2="${Y0}"/><line class="ax" x1="${X0}" y1="${Y0}" x2="${X0}" y2="${Y0-H}"/>`;
    const lbl = { c:'O(1)', l:'O(log n)', n:'O(n)', q:'O(n²)' };
    for (const k of ['c','l','n','q']){
      let d = ''; for (let n=1;n<=20;n+=0.25){ const v=f[k](n); if (v>YMAX){ d += `L${xs(n)},${ys(YMAX)}`; break; } d += `${d?'L':'M'}${xs(n).toFixed(1)},${ys(v).toFixed(1)}`; }
      s += `<path d="${d}" fill="none" stroke="${COLS[k]}" stroke-width="3" stroke-linecap="round"/>`;

      <tr><td><b style="color:${COLS.c}">O(1)</b> constant</td><td>read scores[3]</td>${sizes.map(z=>`<td class="mono">1</td>`).join('')}</tr>
